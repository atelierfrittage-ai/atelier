  // Modification d'un élément existant : fusion champ par champ (campagne 2026-10-17) à partir de l'élément tel qu'il
  // a été ouvert ; les champs changés ailleurs (tablette) sont gardés.
  if(item&&origine&&vu!==null){
    const champs=o=>{const x=Object.assign({},o||{});delete x.updated;delete x._attente;return x};
    const f={lire:d=>champs(trouve(d)),
      ecrire:(d,p)=>{const st=d.state=d.state||{},l=st[A.liste]=st[A.liste]||[],i=l.findIndex(x=>x.id===id);const o=Object.assign({},i>=0?l[i]:{},p,{id,_attente:true});if(i<0)l.push(o);else l[i]=o;return d},
      corps:(p,d)=>{const v=version(d);return {app,secteur:sec,items:[Object.assign({},p,{id})],bases:{[id]:taches?{empreinte:v}:{updated:v}}}}};
    enregistrer(tacheFusion({cle:'contenu-lire|'+JSON.stringify({app,secteur:sec}),op:'contenu-ecrire',page,libelle:String(item[A.titre]||''),esp,vu,version,
      nouvelle:j=>{const o=(((j.data||{}).state||{})[A.liste]||[]).find(x=>x.id===id);return o?(taches?JSON.stringify(o):(o.updated||0)):undefined},
      apres:(j,base)=>Object.assign({},base,{rev:j.data.rev,state:j.data.state}),reprise:edit?()=>{S.edit=edit}:null},f,()=>champs(item),champs(origine)));
    return;
  }
  enregistrer({cle:'contenu-lire|'+JSON.stringify({app,secteur:sec}),op:'contenu-ecrire',page,libelle:String(item?item[A.titre]||'':('retrait de '+(retire[A.titre]||''))),
    esp,vu:vu===null?undefined:vu,version:vu===null?undefined:version,
    construire:d=>{const v=version(d),bases=vu===null?{}:{[id]:taches?{empreinte:v}:{updated:v}};
      return item?{app,secteur:sec,items:[item],bases}:{app,secteur:sec,supprimer:id,bases}},
    // Premier élément d'un secteur vide (2026-10-19) : l'état affiché pendant l'envoi part de l'état de départ (vierge :
    // catégories, postes), sinon un « Nouveau » ouvert avant la réponse n'aurait plus de catégories à proposer.
    vue:d=>{const st=d.state=d.state||JSON.parse(JSON.stringify(d.vierge||{})),l=st[A.liste]=st[A.liste]||[],i=l.findIndex(x=>x.id===id);
      if(item){if(i<0)l.push(Object.assign({},item,{_attente:true}));else l[i]=Object.assign({},l[i],item,{_attente:true})}
      else if(i>=0){if(taches)l[i]=Object.assign({},l[i],{archived:true});else l.splice(i,1)}
      return d},
    nouvelle:j=>{const o=(((j.data||{}).state||{})[A.liste]||[]).find(x=>x.id===id);return o?(taches?JSON.stringify(o):(o.updated||0)):undefined},
    apres:(j,base)=>Object.assign({},base,{rev:j.data.rev,state:j.data.state}),
    reprise:edit?()=>{S.edit=edit}:null});
}

async function actionConges(b){
  const sec=S.calSecAff||unSecteur(),r=await lire('calendrier-lire',{secteur:sec}),cal=r.data&&r.data.cal;if(!cal)return;
  const n=JSON.parse(JSON.stringify(cal));n.conges=n.conges||[];n.rempl=n.rempl||{};let resume='';
  if(b.dataset.cg==='ajouter'){
    const nom=document.getElementById('cgNom').value,du=document.getElementById('cgDu').value,au=document.getElementById('cgAu').value||du;
    if(!nom||!/^\d{4}-\d\d-\d\d$/.test(du)||au<du){S.msgCal=['err','<b>Choisissez la personne et les dates (la fin après le début).</b>'];return chargerPage()}
    n.conges.push({id:'c'+alea(10),nom,du,au});resume='congé ajouté : '+nom+' du '+du+' au '+au;
  }else{const c=n.conges.find(x=>x.id===b.dataset.id);n.conges=n.conges.filter(x=>x.id!==b.dataset.id);delete n.rempl[b.dataset.id];resume='congé retiré'+(c?' : '+c.nom:'')}
  // Temps masqué (2026-10-16) : le congé ajouté ou retiré est appliqué à la version confirmée au moment de l'envoi.
  const ajout=b.dataset.cg==='ajouter'?n.conges[n.conges.length-1]:null,retire=ajout?null:b.dataset.id;
  enregistrerCalendrier(sec,cal.maj||0,base=>{const x=clone(base||{});x.conges=(x.conges||[]).filter(c=>c.id!==retire);x.rempl=x.rempl||{};if(retire)delete x.rempl[retire];if(ajout&&!x.conges.some(c=>c.id===ajout.id))x.conges.push(ajout);return x},resume,null);

// Calendrier en temps masqué : version = cal.maj du secteur ; changer(cal confirmé) → cal à envoyer.
// Passé figé (décision 2026-10-16, moteur CalMaint de l'appli) : photographie des personnes prévues jusqu'à la veille,
// calculée avec le calendrier CONFIRMÉ d'avant le changement (d), jointe au calendrier envoyé.
function figerCal(d,nouveau){
  try{if(typeof CalMaint==='undefined'||!CalMaint.figer||!d||!d.cal||!nouveau)return nouveau;const fg=CalMaint.figer(etatCalendrier(d),undefined,nouveau);if(fg)return Object.assign({},nouveau,{fige:fg})}catch(e){}
  return nouveau;
}
function enregistrerCalendrier(sec,vu,changer,resume,reprise,origine){
  // Réglages : fusion réglage par réglage (campagne 2026-10-17) à partir du calendrier tel qu'il a été ouvert.
  if(origine){const champs=c=>{const x=clone(c||{});delete x.maj;return x};
    const f={lire:d=>champs(d.cal),ecrire:(d,p)=>{const m=d.cal?d.cal.maj:0;d.cal=Object.assign(figerCal(d,clone(p)),{maj:m});return d},
      corps:(p,d)=>({secteur:sec,cal:figerCal(d,clone(p)),depuis:Number(d.cal&&d.cal.maj)||0,resume})};
    enregistrer(tacheFusion({cle:'calendrier-lire|'+JSON.stringify({secteur:sec}),op:'calendrier-ecrire',page:'calendrier',libelle:'Calendrier ('+resume+')',
      esp:'cal|'+sec,vu,version:d=>Number(d.cal&&d.cal.maj)||0,nouvelle:j=>Number(j.data&&j.data.cal&&j.data.cal.maj)||undefined,
      apres:(j,base)=>Object.assign(base,{cal:j.data.cal}),reprise},f,()=>champs(changer(origine)),champs(origine)));
    return;
  }
  enregistrer({cle:'calendrier-lire|'+JSON.stringify({secteur:sec}),op:'calendrier-ecrire',page:'calendrier',libelle:'Calendrier ('+resume+')',
    esp:'cal|'+sec,vu,version:d=>Number(d.cal&&d.cal.maj)||0,
    construire:d=>({secteur:sec,cal:figerCal(d,changer(d.cal)),depuis:Number(d.cal&&d.cal.maj)||0,resume}),
    vue:d=>{const m=d.cal?d.cal.maj:0;d.cal=Object.assign(figerCal(d,changer(d.cal)),{maj:m});return d},
    nouvelle:j=>Number(j.data&&j.data.cal&&j.data.cal.maj)||undefined,
    apres:(j,base)=>Object.assign(base,{cal:j.data.cal}),reprise});
}

// Capture d'écran du plan d'un plateau (outil de capture de Windows), puis envoyée à Google comme une photo.
function imageVersPhoto(data){
  return new Promise((ok,ko)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let d=cv.toDataURL('image/jpeg',.85);if(d.length>2900000)d=cv.toDataURL('image/jpeg',.6);ok(d)};im.onerror=()=>ko(new Error('Capture illisible.'));im.src=data});
}
async function capturePlan(machine,fid){
  S.msgLanc=['info','Entourez le plan du plateau à l’écran (outil de capture de Windows)…'];chargerPage();
  const r=await apiPC('/api/capture',{outil:true});
  if(!r||!/^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(String(r.data||'')))throw new Error('Pas de capture reçue.');
  const data=await imageVersPhoto(r.data),id='p'+alea(24),j=await appel('photo-ecrire',{id,data});
  if(j.status!==200)throw new Error((j.data&&j.data.error)||'Photo refusée.');
  if(/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(data))S.photos[id]=data;
  return envoyerLancements([{type:'modifier',machine,fid,photo:id}],'Capture jointe au fichier.');
}

// Un texte (ou un nom de champ) ressemble-t-il à un nom de fichier ? (tout l'objet, comme le script)
const rdSuspect=(o,p)=>{p=p||0;if(p>6)return true;if(typeof o==='string')return RD_NOM_FICHIER.test(o);if(Array.isArray(o))return o.some(x=>rdSuspect(x,p+1));
  if(o&&typeof o==='object')return Object.keys(o).some(k=>RD_NOM_FICHIER.test(k)||/cas/i.test(k)||rdSuspect(o[k],p+1));return false};
// Contrôle du fichier choisi (le script refait tous les contrôles).
function rdLireImport(texte,st,parc){
  const er=[];let o=null;
  try{o=JSON.parse(texte)}catch(x){return {erreurs:['Fichier illisible (ce n’est pas le fichier d’import).']}}
  if(!o||o.format!=='rd-import-excel'||o.secteur!=='frittage'||!Array.isArray(o.essais)||!o.essais.length)return {erreurs:['Ce n’est pas le fichier d’import des essais de l’Excel du frittage.']};
  const vus={};
  o.essais.forEach((e,i)=>{
    if(!e||typeof e!=='object'){er.push('Essai '+(i+1)+' illisible.');return}
    const autres=Object.keys(e).filter(k=>!RD_IMPORT_CHAMPS.includes(k));if(autres.length)er.push('Essai '+(e.num||i+1)+' : champ non permis « '+autres[0]+' ».');
    if(!(Number.isInteger(e.num)&&e.num>0)||vus[e.num])er.push('Essai '+(i+1)+' : numéro invalide ou en double.');vus[e.num]=1;
    if(!String(e.titre||'').trim())er.push('Essai '+e.num+' : sans nom.');
    if(!RD_AV.some(a=>a[0]===e.avancement))er.push('Essai '+e.num+' : avancement inconnu.');
    if(rdSuspect(e))er.push('Essai '+e.num+' : un texte ressemble à un nom de fichier.');
  });
  const deja=(st.essais||[]).filter(e=>vus[e.num]||e.origine==='excel');
  if(deja.length)er.push('Des essais du frittage portent déjà ces numéros, ou l’Excel a déjà été repris (n° '+deja.slice(0,5).map(e=>e.num).join(', ')+') : import refusé.');
  // Correspondance proposée : même nom (sans tenir compte des majuscules) ou ancien nom d'une machine du parc.
  const carte={},cmp=x=>String(x).trim().toLowerCase();
  o.essais.forEach(e=>(e.machines||[]).forEach(n=>{if(carte[n]!==undefined)return;const m=parc.find(p=>cmp(p.nom)===cmp(n)||(p.anciens||[]).some(a=>cmp(a)===cmp(n)));carte[n]=m?m.nom:''}));
  return {essais:o.essais,erreurs:er,carte};
}

// Création : sans version ; modification : fusion champ par champ à partir de l'essai tel qu'il a été ouvert (updated).
function enregistrerRd(sec,item,origine,libelle,reprise){
  const cle=rdCle(sec),id=item.id,esp='rd|'+sec+'|'+id;
  const trouve=d=>((d.state||{}).essais||[]).find(x=>x.id===id);
  const version=d=>{const o=trouve(d);return o?(o.updated||0):undefined};
  const nouvelle=j=>{const o=(((j.data||{}).state||{}).essais||[]).find(x=>x.id===id);return o?(o.updated||0):undefined};
  const apres=(j,base)=>Object.assign({},base,{rev:j.data.rev,state:j.data.state,vierge:null});
  if(origine){
    const f={lire:d=>rdChamps(trouve(d)),
      ecrire:(d,p)=>{const st=d.state=d.state||{types:[],essais:[]},l=st.essais=st.essais||[],i=l.findIndex(x=>x.id===id);const o=Object.assign({},i>=0?l[i]:{},p,{id,_attente:true});if(i<0)l.push(o);else l[i]=o;return d},
      corps:(p,d)=>({secteur:sec,essai:Object.assign({},p,{id}),base:{updated:version(d)||0}})};
    enregistrer(tacheFusion({cle,op:'rd-ecrire',page:'c-rd',libelle,esp,vu:origine.updated||0,version,nouvelle,apres,reprise},f,()=>rdChamps(item),rdChamps(origine)));
    return;

document.addEventListener('change',async e=>{const el=e.target;
  // Étiquettes QR : case de départ, machines hors service (affichage seulement).
  if((el.id==='qrDepart'||el.id==='qrHs')&&S.qr){if(el.id==='qrDepart')S.qr.depart=Math.max(1,Math.min(QR_CASES,Number(el.value)||1));else S.qr.hs=el.checked;return chargerPage()}
  // Section R&D : champs du brouillon, filtre par type, correspondance des machines, fichiers (photo, import).
  if(el.dataset&&(el.dataset.rdf||el.dataset.rdp||el.dataset.rdr||el.dataset.rdt)){rdChamp(el);if(el.tagName==='SELECT')chargerPage();return}
  if(el.dataset&&el.dataset.rdType&&S.rd){S.rd.f.type=el.value;return chargerPage()}
  if(el.dataset&&el.dataset.rdMap!=null&&S.rd&&S.rd.imp){S.rd.imp.carte[el.dataset.rdMap]=el.value;return chargerPage()}
  if(el.dataset&&(el.dataset.rdImport||el.dataset.rdphoto))return rdFichier(el);
  if(el.dataset&&(el.dataset.ce||el.dataset.ceL))return saisieCalendrier(el);
  if(el.dataset&&el.dataset.drCible&&S.dr){S.dr.cible=el.value;S.dr.msg=null;return chargerPage()}
  if(el.dataset&&el.dataset.admLogo&&el.files&&el.files[0]&&S.adm){try{S.adm.b.apparence.logo=await admLogo(el.files[0]);S.adm.sale=true}catch(x){S.adm.msg=['err','<b>'+esc(x.message)+'</b>']}return chargerPage()}
  if(el.dataset&&(el.dataset.adm||el.dataset.admTuile||el.dataset.admZone!=null)){saisieAdmin(el);if(el.tagName==='SELECT'||el.type==='color')chargerPage();return}
  if(el.dataset&&el.dataset.canal&&CONSOLE_PC)return changerCanalTablette(el);
  if(el.dataset&&el.dataset.ecranAuto!=null){const v=el.dataset.ecranAuto;
    try{if(v==='atelier')localStorage.setItem('lancements-ecran-auto','1');else localStorage.removeItem('lancements-ecran-auto');if(v==='fraisage')localStorage.setItem('console-ecran-auto','maintenance:fraisage');else if(v==='tournant')localStorage.setItem('console-ecran-auto','tournant');else localStorage.removeItem('console-ecran-auto')}catch(x){}
    return}
  if(el.dataset&&el.dataset.fm)return champSaisi(el);
  if(el.dataset&&(el.dataset.f&&(el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date'))){champSaisi(el);if(el.dataset.rerender)chargerPage();return}
  // Types de machine (parc) : saisis dans S.types.
  if(el.dataset&&el.dataset.ty&&S.types){S.types.liste[+el.dataset.ty][el.dataset.tk]=el.value;return}
  // Photo d'une étape (contenus) ou plan d'un fichier (lancements) : envoyée tout de suite à Google.
  if(el.dataset&&(el.dataset.fphoto||el.dataset.lanPhoto)&&el.files&&el.files[0]){
    const lab=el.closest('label');if(lab)lab.firstChild&&(lab.lastChild.previousSibling.textContent=' Envoi…');
    try{const id=await envoyerPhoto(el.files[0]);
      if(el.dataset.fphoto==='images+'&&S.edit){S.edit.item.images=(S.edit.item.images||[]).concat({photo:id,texte:''}).slice(0,3);S.edit.sale=true;chargerPage()}
      else if(el.dataset.fphoto&&S.edit){ecrireChemin(S.edit.item,el.dataset.fphoto,id);S.edit.sale=true;chargerPage()}
      else if(el.dataset.lanPhoto)envoyerLancements([{type:'modifier',machine:el.dataset.lanPhoto,fid:el.dataset.fid,photo:id}],'Plan joint.');
    }catch(x){if(x.message==='session')return;if(el.dataset.fphoto&&S.edit){S.edit.msg=['err','<b>'+esc(x.message)+'</b>']}else S.msgLanc=['err','<b>'+esc(x.message)+'</b>'];chargerPage()}
    return;
  }
  if(e.target.id==='accFin'){const v=e.target.value;changeBrouillon(x=>{x.fin=/^\d{4}-\d\d-\d\d$/.test(v)?v:''})}});
document.addEventListener('input',e=>{if(e.target.dataset&&rdChamp(e.target))return;if(e.target.id==='rdQ'&&S.rd){S.rd.f.q=e.target.value;clearTimeout(S.tq);S.tq=setTimeout(async()=>{await chargerPage();const q=document.getElementById('rdQ');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},250);return}if(e.target.dataset&&(e.target.dataset.adm||e.target.dataset.admTuile||e.target.dataset.admZone!=null)&&e.target.tagName!=='SELECT'&&e.target.type!=='color'){saisieAdmin(e.target);return}if(e.target.dataset&&e.target.dataset.ce&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT'){saisieCalendrier(e.target);return}if(e.target.dataset&&e.target.dataset.ty&&S.types){S.types.liste[+e.target.dataset.ty][e.target.dataset.tk]=e.target.value;return}if(e.target.dataset&&e.target.dataset.f&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT'){champSaisi(e.target);return}if(e.target.id==='parcQ'){S.parcQ=e.target.value;clearTimeout(S.tq);S.tq=setTimeout(async()=>{await chargerPage();const q=document.getElementById('parcQ');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},250)}});

// --- Application installable (2026-10-17) : console en ligne seulement (jamais la console du PC). -----------------
// Service worker de /console/ (sw.js à côté de la page) : page et fichiers statiques seulement, jamais de données ni
// d'appel à Google. Nouvelle version publiée → bandeau « Nouvelle version disponible : recharger ». La session reste en
// sessionStorage : elle disparaît quand la fenêtre de l'application est fermée.
const APP={installer:null,attente:null};
function majBoutonsApp(){document.querySelectorAll('[data-act="installer"]').forEach(b=>{b.hidden=!APP.installer})}
const boutonInstaller=()=>CONSOLE_PC?'':'<button class="btn" type="button" data-act="installer"'+(APP.installer?'':' hidden')+' style="margin-top:8px">'+svg('version')+'Installer l’application</button>';
function bandeauMaj(w){
  APP.attente=w;if(document.getElementById('majApp'))return;
  const d=document.createElement('div');d.id='majApp';d.setAttribute('role','status');
  d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(21,36,43,.25);padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)';
  d.innerHTML='<span><b>Nouvelle version disponible.</b></span><button class="btn pri" type="button" data-act="maj-app">Recharger</button>';
  document.body.appendChild(d);
}
if(!CONSOLE_PC&&'serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{scope:'./'}).then(reg=>{
      const suivre=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)bandeauMaj(w)})};
      if(reg.waiting&&navigator.serviceWorker.controller)bandeauMaj(reg.waiting);
      reg.addEventListener('updatefound',()=>suivre(reg.installing));
      // Nouvelle publication cherchée au retour sur la fenêtre et toutes les 30 minutes.
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
      setInterval(()=>reg.update().catch(()=>{}),30*60000);
    }).catch(()=>{});
    let recharge=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(APP.demande&&!recharge){recharge=true;location.reload()}});
  });
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();APP.installer=e;majBoutonsApp()});
  addEventListener('appinstalled',()=>{APP.installer=null;majBoutonsApp()});
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='installer'&&APP.installer){const p=APP.installer;APP.installer=null;majBoutonsApp();p.prompt();p.userChoice.catch(()=>{})}
  if(b.dataset.act==='maj-app'&&APP.attente){
    // Des enregistrements partent encore ? On attend qu'ils soient confirmés (rien ne doit se perdre).
    if(typeof enAttente==='function'&&enAttente()){b.textContent='Enregistrement en cours…';return}
    APP.demande=true;APP.attente.postMessage({type:'activer'})}});
// Hors ligne : message clair à l'écran de connexion (la page vient de la copie gardée).
addEventListener('offline',()=>{if(!S.jeton)render()});addEventListener('online',()=>{if(!S.jeton)render()});
addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));if(P(h)&&h!==S.page&&!(S.edit&&S.edit.sale)&&!rdSaisie()){S.page=h;S.edit=null;if(S.moi)render()}});
// Démarrage : session de cet onglet encore valable ? (le script le dit)
(async()=>{
  // Console du PC : écran télé ouvert au démarrage (réglé dans « Écrans télé »), comme l'ancienne console.
  if(CONSOLE_PC&&!location.hash){const v=ecranAuto();if(v==='atelier'){location.replace('/ecran');return}if(v==='fraisage'){location.replace('/ecran-maintenance?secteur=fraisage');return}if(v==='tournant'){location.replace('/ecran-tournant');return}}
  S.jeton=lireJeton();
  // #parc, #calendrier… : la partie à ouvrir (le menu reste limité aux parties visibles).
  const h=decodeURIComponent(location.hash.slice(1));if(P(h))S.page=h;
  if(S.jeton&&URL_SCRIPT){try{await demarrer()}catch(e){if(e.message!=='session'){S.jeton='';ecrireJeton('')}}}
  render();
})();
</script>
