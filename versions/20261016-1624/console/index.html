<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Console de l’atelier</title>
<style>
/* Console en ligne du Pack Tablettes (lot 3, 2026-10-15) : LECTURE SEULE, d'après la maquette validée.
   Page publique : elle ne contient AUCUN secret (seulement l'adresse du script Google, ajoutée par construire-unique.mjs).
   Chaque lecture est contrôlée par le script Google (session, partie, secteur) : le menu n'est qu'un affichage. */
:root{
  --bg:#f3f6f7;--card:#fff;--ink:#15242b;--muted:#5d6f78;--line:#d9e1e5;--line2:#e8eef0;
  --accent:#0B8A96;--accent-dark:#065E66;--accent-soft:#DDF3F5;
  --ok:#1F7A3A;--ok-bg:#E2F5E7;--warn:#A85A00;--warn-bg:#FFF1D6;--warn-line:#E08A00;--err:#C0262D;--err-bg:#FDE8E8;
  --nav:#132229;--nav2:#1c313a;--shadow:0 1px 2px rgba(21,36,43,.06),0 4px 14px rgba(21,36,43,.06);
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (min-width:1700px){body{font-size:17px}}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none}
.pa{--c1:#16a3ad;--c2:#0b6f78;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,var(--c1),var(--c2));color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.pa svg{width:22px;height:22px}
.pa.s{width:30px;height:30px;border-radius:9px}.pa.s svg{width:17px;height:17px}
.pa.l{width:56px;height:56px;border-radius:16px}.pa.l svg{width:30px;height:30px}
/* Connexion */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 20% 0%,#dff2f4,transparent),var(--bg)}
.login .box{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 30px 24px;box-shadow:var(--shadow)}
.login h1{margin:14px 0 2px;font-size:26px}
.login p.sub{margin:0 0 20px;color:var(--muted)}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600;color:var(--muted);margin-bottom:14px}
.in{border:1px solid #b9c6cc;border-radius:10px;padding:10px 12px;min-height:48px;background:#fff;width:100%;color:var(--ink);font-weight:400}
.in:focus{outline:3px solid #9ED6DC;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;min-height:44px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap;font-size:15px}
.btn:hover{border-color:#b9c6cc;background:#fafcfc}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-dark)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn:disabled{opacity:.55;cursor:wait}
.msg{border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.msg.err{background:var(--err-bg);border:1px solid #e9a3a6}
.msg.warn{background:var(--warn-bg);border:1px solid var(--warn-line)}
.msg.ok{background:var(--ok-bg);border:1px solid #9fd3ad}
.msg.info{background:var(--accent-soft);border:1px solid #9ED6DC}
.msg svg{margin-top:2px}
/* Coquille */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.nav{background:var(--nav);color:#d3e0e5;position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 10px 20px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.brand b{display:block;color:#fff;font-size:17px;line-height:1.2}
.brand span{font-size:14px;opacity:.75}
.nav h3{margin:14px 10px 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8fa6af;font-weight:700}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#d3e0e5;text-align:left;padding:6px 10px;min-height:44px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer}
.nav button:hover{background:var(--nav2);color:#fff}
.nav button[aria-current="page"]{background:#0e4d55;color:#fff;box-shadow:inset 3px 0 0 #5fd0da}
.nav button .t{flex:1;line-height:1.25}
.nav .bdg{font-size:13px;font-weight:700;border-radius:999px;padding:1px 8px;background:#2b4651;color:#cfe3e8}
.nav .bdg.r{background:var(--err);color:#fff}
.nav .foot{margin-top:auto;padding:14px 10px 0;font-size:14px;color:#8fa6af}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 24px;background:rgba(243,246,247,.95);border-bottom:1px solid var(--line);flex-wrap:wrap}
.secsel{display:inline-flex;gap:3px;background:#e3eaed;padding:4px;border-radius:12px;flex-wrap:wrap}
.secsel button{border:0;background:transparent;border-radius:9px;padding:6px 14px;min-height:40px;font-weight:600;color:var(--muted);cursor:pointer;font-size:15px}
.secsel button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(21,36,43,.14)}
.secfixe{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;min-height:44px}
.secfixe small{font-weight:600;color:var(--muted);font-size:14px}
.grow{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);font-weight:600}
.sync.ok{color:var(--ok)}.sync.err{color:var(--err)}.sync.warn{color:var(--warn)}
button.sync{border:1px solid transparent;background:transparent;border-radius:10px;padding:4px 10px;min-height:44px;cursor:pointer;font:inherit;font-weight:600;font-size:15px}
button.sync:hover{background:#fff;border-color:var(--line)}
button.sync.err{background:var(--err-bg);border-color:#e9a3a6}button.sync.warn{background:var(--warn-bg);border-color:var(--warn-line)}
#panneauGoogle{position:fixed;right:24px;top:72px;width:min(480px,92vw);z-index:40;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(21,36,43,.25);padding:16px 18px;font-size:15px}
#panneauGoogle h2{margin:0 0 6px;font-size:18px}
.who{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 4px}
.who .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dark);font-weight:800;font-size:15px}
.who b{display:block;font-size:15px;line-height:1.2}.who span{font-size:14px;color:var(--muted)}
.who .btn{padding:4px 12px;border-radius:999px}
#page{padding:22px 24px 80px;max-width:1560px;width:100%}
/* Éléments communs */
.ph{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:25px;line-height:1.2}
.ph p{margin:4px 0 0;color:var(--muted);max-width:820px}
.ph .grow{min-width:260px}
.ro{display:inline-flex;align-items:center;gap:6px;background:#eef2f4;border:1px solid #cdd8dc;color:#41545C;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;vertical-align:middle;margin-left:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:15px}
/* Réactivité (2026-10-16) : état des enregistrements masqués, squelette pendant une première lecture, clic visible. */
.envoi{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.envoi.ok{color:var(--ok)}.envoi.err{color:var(--err)}
#bandeauEnvoi:empty{display:none}#bandeauEnvoi{padding:12px 24px 0}
.btn:active,.nav button:active,.chip:active{transform:scale(.97)}
.btn[aria-busy="true"]{opacity:.7;cursor:progress}
.sq{background:linear-gradient(90deg,#e9eef0 25%,#f4f7f8 50%,#e9eef0 75%);background-size:200% 100%;animation:sq 1.2s linear infinite;border-radius:12px;height:110px;margin:0 0 16px}
.sq.h{height:54px;width:55%}
@keyframes sq{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sq{animation:none}}
.absent{position:fixed;inset:0;z-index:50;background:var(--bg,#f2f5f6);display:grid;place-items:center;padding:16px}
.absent .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(21,36,43,.18)}
.absent h2{margin:0 0 10px}
.tag.attente{background:#fff4dc;color:#8a5a00;border:1px dashed #d8a640}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;background:#e9eef0;color:#41545C;white-space:nowrap;flex:none}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.err{background:var(--err-bg);color:var(--err)}.tag.acc{background:var(--accent-soft);color:var(--accent-dark)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.g3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stack>*+*{margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;min-height:44px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark)}
.vide{padding:22px;text-align:center;color:var(--muted);font-size:15px}
/* Accueil */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--k,#c9d3d7);cursor:pointer;text-align:left;font-size:15px}
.kpi:hover{border-color:#b9c6cc}
.kpi small{font-size:14px;color:var(--muted);font-weight:700}
.kpi b{font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.kpi b .sy{font-size:18px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--k)}
.kpi span{font-size:14px;color:var(--muted)}
.k-err{--k:var(--err)}.k-warn{--k:var(--warn-line)}.k-ok{--k:var(--ok)}.k-acc{--k:var(--accent)}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;font-size:15px}
.sec:hover{border-color:var(--accent)}
.sec h3{margin:0;font-size:17px;display:flex;align-items:center;gap:10px}
.sec ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.sec li{display:flex;justify-content:space-between;gap:8px}
.sec li span{color:var(--muted)}
.al{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:#fff8ec;border:1px solid #f3d7a6}
.al.err{background:#fff4f4;border-color:#f0c2c4}
.al .sy{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;background:var(--warn-line)}
.al.err .sy{background:var(--err)}
.al .tx{flex:1;font-size:15px}.al .tx b{display:block}
.als{display:grid;gap:8px}
.lan{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:15px}
.lan:last-child{border-bottom:0}
.st{font-weight:700;border-radius:999px;padding:2px 10px;font-size:14px;color:#fff;white-space:nowrap}
.st-fonctionnement{background:var(--ok)}.st-prete{background:var(--warn)}.st-preparation{background:#41545C}.st-libre{background:#6f8187}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.quick button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:60px;font-weight:600;cursor:pointer;text-align:left;font-size:15px}
.quick button:hover{border-color:var(--accent);background:var(--accent-soft)}
/* Parc */
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tb .in{max-width:380px;min-height:44px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mac{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow);font-size:15px}
.mac:hover{border-color:var(--accent)}
.mac[aria-current="true"]{outline:3px solid var(--accent)}
.mac .vis{height:64px;display:grid;place-items:center;background:linear-gradient(140deg,#e9f3f5,#d5e6ea);color:var(--accent-dark)}
.mac.off .vis{background:#eef1f2;filter:grayscale(1)}
.mac .bd{padding:10px 14px 12px;display:grid;gap:4px}
.mac .bd b{font-size:17px}
.mac .bd .l{font-size:14px;color:var(--muted)}
.mac .sec-t{z-index:1;position:absolute;top:10px;left:10px;font-size:13px;font-weight:800;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 10px;color:var(--accent-dark)}
.parc{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.parc.ouvert{grid-template-columns:minmax(0,1fr) 400px}
.fiche{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.fiche dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:15px}
.fiche dt{color:var(--muted);font-weight:600}.fiche dd{margin:0}
.photo{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-top:8px}
/* Calendrier */
.cal{display:grid;border:1px solid var(--line);border-radius:14px;overflow:auto;background:#fff}
.cal>div{padding:8px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);min-height:54px;font-size:14px}
.cal .hd{background:#f5f8f9;font-weight:800;color:var(--muted);min-height:auto;text-align:center}
.cal .hd.auj{background:var(--accent-soft);color:var(--accent-dark)}
.cal .mn{font-weight:700;font-size:15px}
.op{display:flex;flex-direction:column;border-radius:8px;padding:4px 8px;font-weight:700;margin-bottom:4px;font-size:14px;border:1px solid;line-height:1.3}
.op small{font-weight:600;font-size:13px;opacity:.9}
.op.r{background:var(--err-bg);border-color:#f0c2c4;color:var(--err)}
.op.a{background:var(--warn-bg);border-color:#f3d7a6;color:var(--warn)}
.op.f{background:var(--ok-bg);border-color:#bfe2c8;color:var(--ok)}
.op.p{background:#f3f6f7;border-color:var(--line);color:#41545C}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:10px 0}
/* Contenus */
.cont{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
.liste{display:grid;gap:6px;max-height:calc(100vh - 220px);overflow:auto}
.it{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;min-height:52px;cursor:pointer;font-size:15px;font-weight:600}
.it:hover{border-color:#b9c6cc}
.it[aria-current="true"]{border:2px solid var(--accent);background:#f4fbfc;padding:7px 11px}
.it small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.det h3{margin:16px 0 6px;font-size:16px}
.det ol,.det ul{margin:0;padding-left:22px}.det li{margin:4px 0}
.det .att{color:var(--warn);font-weight:600}
/* Accès des managers (modification) */
.accg{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;padding-bottom:70px}
.mlist{display:grid;gap:8px}
.mcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;min-height:64px;font-size:15px}
.mcard:hover{border-color:#b9c6cc}
.mcard[aria-current="true"]{border:2px solid var(--accent);background:#f4fbfc;padding:9px 11px}
.mcard .av,.av.gros{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--accent-soft);color:var(--accent-dark);flex:none}
.av.gros{width:52px;height:52px;font-size:18px}
.mcard.coupe .av{background:#eceff0;color:#6f8187}
.mcard b{display:block}.mcard span{font-size:14px;color:var(--muted)}
.mcard .r{margin-left:auto;text-align:right}
.etat{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sw button{border:0;background:#fff;min-height:48px;padding:6px 18px;font-weight:700;cursor:pointer;color:var(--muted);font-size:15px}
.sw button+button{border-left:1px solid var(--line)}
.sw button:disabled{cursor:not-allowed;opacity:.6}
.sw button.on-ok[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok)}
.sw button.on-err[aria-pressed="true"]{background:var(--err-bg);color:var(--err)}
.perm td{padding:6px 10px;vertical-align:middle}.perm td:last-child,.perm th:last-child{width:1%;white-space:nowrap}
.perm tr.grp td{background:#f5f8f9;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px}
.perm .nm{display:flex;align-items:center;gap:10px;font-weight:600}
.tri{display:inline-grid;grid-template-columns:repeat(3,max-content);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tri button{border:0;background:#fff;min-height:44px;min-width:110px;padding:4px 12px;white-space:nowrap;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tri button+button{border-left:1px solid var(--line)}
.tri button[aria-pressed="true"].v0{background:#eceff0;color:#41545C}
.tri button[aria-pressed="true"].v1{background:var(--accent-soft);color:var(--accent-dark)}
.tri button[aria-pressed="true"].v2{background:var(--ok-bg);color:var(--ok)}
.tri button:disabled{cursor:not-allowed;color:#a9b6bb;background:#fafbfb}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);font-weight:600}
.btn.dan{background:#fff;border-color:#e9a3a6;color:var(--err)}
.btn.dan.plein{background:var(--err);border-color:var(--err);color:#fff}
.savebar{position:fixed;bottom:12px;left:276px;right:24px;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:0 -6px 22px rgba(21,36,43,.08)}
.savebar .st{flex:1;font-size:15px;color:var(--muted)}
@media (max-width:1100px){.accg{grid-template-columns:1fr}}
@media (max-width:860px){.savebar{left:16px;right:16px}}
/* Édition (lot 4) */
textarea.in{min-height:84px;resize:vertical;font:inherit}
.form{display:grid;gap:14px}
.form .lbl{margin-bottom:6px}
.fs{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0}

<script>
'use strict';
// Adresse du script Google : rangée ici par construire-unique.mjs à la publication (l'adresse seulement, JAMAIS de code).
var GOOGLE_URL_PUBLIE="https://script.google.com/macros/s/AKfycbze1gObxtHz27INigV6AM_PSkjHxhT3uRpDEusERH9wzZkoowbF93iVKCtuGz02x5pBog/exec";
// true quand la page est servie par la console du PC (serveur.mjs, lot 7) : construire-unique.mjs assemblerConsole.
var CONSOLE_PC=false;

// ---------------------------------------------------------------------------------------------------------------
// Moteur du calendrier de maintenance : recopié de l'appli Maintenance (bloc <calendrier>) par construire-unique.mjs.
// <calendrier> Moteur du calendrier de maintenance (ES5, sans dépendance) : recopié tel quel dans l'écran fraisage de la
// console du PC (route /maintenance-calendrier.js du serveur). Entrée : l'état de l'appli (ops, journal, operators, machines, cal).
var CalMaint=(function(){
  var p2=function(n){return (n<10?'0':'')+n};
  function D(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2],12)}
  function S(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
  function ajoute(s,n){var d=D(s);d.setDate(d.getDate()+n);return S(d)}
  function lundi(s){var d=D(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return S(d)}
  function ecart(a,b){return Math.round((D(b)-D(a))/864e5)}
  function auj(t){return S(new Date(t||Date.now()))}
  // Jour travaillé : pas fermé, et jour de la semaine prévu (période particulière, sinon semaine habituelle).
  function travaille(cal,s){
    var i;for(i=0;i<cal.fermes.length;i++)if(s>=cal.fermes[i].du&&s<=cal.fermes[i].au)return false;
    var j=cal.jours;for(i=0;i<cal.periodes.length;i++)if(s>=cal.periodes[i].du&&s<=cal.periodes[i].au){j=cal.periodes[i].jours;break}
    return j.indexOf(D(s).getDay())>=0;
  }
  function ferme(cal,s){for(var i=0;i<cal.fermes.length;i++)if(s>=cal.fermes[i].du&&s<=cal.fermes[i].au)return cal.fermes[i].nom||'Fermé';return ''}
  // Rang d'un jour travaillé depuis une date de départ (0 = premier jour travaillé à partir de cette date).
  function rangTravail(cal,debut,s,cache){
    var k=debut+'>'+s;if(cache&&cache[k]!=null)return cache[k];
    var n=0,d=debut,sens=s>=debut?1:-1;
    if(sens>0){while(d<s){if(travaille(cal,d))n++;d=ajoute(d,1)}}else{while(d>s){d=ajoute(d,-1);if(travaille(cal,d))n--}}
    if(cache)cache[k]=n;return n;
  }
  // Jour non travaillé : avancé au dernier jour travaillé avant (sans sortir de la semaine).
  function avancer(cal,s,lun){var d=s;while(d>=lun){if(travaille(cal,d))return d;d=ajoute(d,-1)}return ''}
  function equipeDu(cal,s,cache){
    var r=cal.roulement||{},L=(r.equipes||[]).length;if(!L)return null;
    // n absent ou 0 (donnée ancienne ou abîmée) : traité comme 1 (sinon division par zéro).
    var debut=r.debut||'2026-01-05',n=Math.max(1,Math.round(Number(r.n)||1)),i;
    if(r.mode==='jour')i=Math.floor(rangTravail(cal,debut,s,cache)/n);
    else i=Math.floor(ecart(lundi(debut),lundi(s))/7/n);
    return r.equipes[((i%L)+L)%L];
  }
  // Dates d'une règle entre du et au (inclus).
  // Une règle ne compte qu'à partir de sa date « à partir du » et du jour où elle a été créée (l'identifiant contient
  // l'heure de création) : les semaines d'avant le calendrier ne sont ni « à faire » ni « pas faites ».
  function creeeLe(g){var t=parseInt(String(g.id).slice(1,-4),36);return t>1.7e12&&t<4e12?S(new Date(t)):''}
  function datesRegle(cal,g,du,au,cache){
    var q=g.quand,out=[],debut=g.debut||(cal.roulement||{}).debut||'2026-01-05',d,w,t,plancher=creeeLe(g);
    if(!(q.n>=1))q=Object.assign({},q,{n:1});
    if(g.debut&&g.debut>plancher)plancher=g.debut;
    if(plancher&&plancher>du)du=plancher;if(du>au)return out;
    if(q.type==='jour'||q.type==='nj'){for(d=du;d<=au;d=ajoute(d,1))if(travaille(cal,d)&&(q.type==='jour'||((rangTravail(cal,debut,d,cache)%q.n)+q.n)%q.n===0))out.push(d)}
    else if(q.type==='semaine'){
      for(w=lundi(du);w<=au;w=ajoute(w,7)){
        if(((Math.round(ecart(lundi(debut),w)/7)%q.n)+q.n)%q.n!==0)continue;
        var cibles=q.jours.map(function(j){return avancer(cal,ajoute(w,(j+6)%7),w)});
        if(q.dernier)cibles.push(avancer(cal,ajoute(w,6),w));
        cibles.forEach(function(c){if(c&&c>=du&&c<=au&&out.indexOf(c)<0)out.push(c)});
      }
    }else{
      var m=D(du);m.setDate(1);
      for(;S(m)<=au;m.setMonth(m.getMonth()+1)){
        var premier=S(m),lst=[];for(t=premier;t.slice(0,7)===premier.slice(0,7);t=ajoute(t,1))if(D(t).getDay()===q.js)lst.push(t);
        var c=q.rang>=5||q.rang>lst.length?lst[lst.length-1]:lst[q.rang-1];if(!c)continue;
        c=avancer(cal,c,ajoute(c,-6));if(c&&c>=du&&c<=au)out.push(c);
      }
    }
    return out.sort();
  }
  function absent(cal,nom,s){var l=cal.conges||[];for(var i=0;i<l.length;i++){var g=l[i];if(g.nom===nom&&s>=g.du&&s<=g.au)return g}return null}
  // Occurrences entre du et au : {regle, op, date, origine, machines, prevus, noms, equipe, rempl:[{absent,par,valide,conge}], annulee}.
  function occurrences(st,du,au){
    var cal=st.cal;if(!cal||!cal.regles.length)return [];
    var cache={},out=[],charge={},ops={},i;
    st.ops.forEach(function(f){ops[f.id]=f});
    cal.regles.forEach(function(g){
      var f=ops[g.op];if(!f)return;
      // Machines (2026-10-15) : celles de la règle, sinon celles de l'opération encore en service, sinon (opération
      // sans liste) toutes. Opération avec une liste dont plus aucune machine n'est en service : AUCUNE, pas d'occurrence.
      var fm=(f.machines||[]).filter(function(m){return st.machines.indexOf(m)>=0});
      if(f.aucune||((f.machines||[]).length&&!fm.length))return;
      var machines=(g.machines||[]).length?g.machines:(f.machines||[]).length?fm:st.machines;
      var qui=g.qui||{type:'roulement',noms:[]};
      var dates=datesRegle(cal,g,ajoute(du,-7),ajoute(au,7),cache);
      dates.forEach(function(d){
        // Exception sans « noms » (ancienne donnée) : la date peut changer, les personnes restent celles prévues.
        var x=(cal.exc||{})[g.id+'|'+d],date=x&&x.date!==undefined&&x.date!==null?x.date:d;
        if(date?(date<du||date>au):(d<du||d>au))return;
        var eq=qui.type==='roulement'?equipeDu(cal,date||d,cache):null;
        var prevus=x&&Array.isArray(x.noms)&&x.noms.length?x.noms:qui.type==='fixe'?(qui.noms||[]):eq?(eq.personnes||[]):[];
        out.push({regle:g,op:f,date:date,origine:d,annulee:date==='',machines:machines,prevus:prevus.slice(),noms:prevus.slice(),equipe:eq,rempl:[]});
        if(date)prevus.forEach(function(n){charge[n]=(charge[n]||0)+1});
      });
    });
    // Congés : la personne absente est remplacée par le remplaçant validé, sinon par une personne proposée :
    // présente, pas déjà prévue, formée à l'opération (déjà faite seule) de préférence, et la moins chargée.
    var formes={};st.journal.forEach(function(e){if(e.result==='ok'&&e.fid&&e.op&&!e.aide)formes[e.fid+'|'+e.op]=1});
    out.forEach(function(o){
      if(!o.date)return;
      o.noms=o.prevus.map(function(n){
        var g=absent(cal,n,o.date);if(!g)return n;
        var par=(cal.rempl||{})[g.id],valide=!!par;
        if(!par){
          var cand=(st.operators||[]).filter(function(c){return c!==n&&o.prevus.indexOf(c)<0&&!absent(cal,c,o.date)});
          cand.sort(function(a,b){return (formes[o.op.id+'|'+b]||0)-(formes[o.op.id+'|'+a]||0)||(charge[a]||0)-(charge[b]||0)||a.localeCompare(b)});
          par=cand[0]||'';
        }
        o.rempl.push({absent:n,par:par,valide:valide,conge:g});
        return par||n;
      });
    });
    for(i=0;i<out.length;i++)if(!out[i].date)out[i].noms=[];
    return out.filter(function(o){return o.date||o.annulee}).sort(function(a,b){return (a.date||a.origine)<(b.date||b.origine)?-1:1});
  }
  // Une machine est faite pour une occurrence si une maintenance TERMINÉE de l'opération a eu lieu après l'occurrence
  // précédente (une avance est permise) et avant l'occurrence suivante.
  // Machine suivie broche par broche (fraisage) : faite quand chaque broche en service a sa réponse « faite » ou
  // « pas faite » (une broche à tour de rôle : dès que la broche du tour en a une).
  function faite(st,o,m,suivante,precedente){
    if(suivi(st,o.op,m)){var x=brochesOcc(st,o,m,suivante,precedente);return x.fini?(x.e||{id:'',end:D(o.date).getTime(),hs:true}):null}
    for(var i=0;i<st.journal.length;i++){var e=st.journal[i];if(e.result==='ok'&&e.fid===o.op.id&&e.machine===m){var j=S(new Date(e.end));if((precedente?j>precedente:j>=o.date)&&(!suivante||j<suivante))return e}}
    return null;
  }
  // --- Broches (fraisage, 2026-10-16) -----------------------------------------------------------------------------
  // st.broches = {machine: ['1','2',…]} (fiche du parc) ; st.hs = {machine: {'3': true}} (broches hors service
  // aujourd'hui). Sans st.broches (frittage, ancienne console) : rien ne change.
  function axesM(st,m){var a=st.broches&&st.broches[m];return a&&a.length>1?a:[]}
  function aEtapeBroche(l){for(var i=0;i<(l||[]).length;i++)if(l[i]&&l[i].axes)return true;return false}
  // Opération avec au moins une étape « ↻ à faire sur chaque broche » (version de base ou version d'un type).
  function parBroche(f){
    if(f.parBroche!=null)return !!f.parBroche;
    if(aEtapeBroche(f.steps))return true;
    for(var i=0;i<(f.variantes||[]).length;i++)if(aEtapeBroche(f.variantes[i].steps))return true;
    return false;
  }
  function suivi(st,f,m){return axesM(st,m).length>0&&parBroche(f)}
  function horsService(st,m,b){return !!(st.hs&&st.hs[m]&&st.hs[m][b])}
  // Broches hors service aujourd'hui d'après bhs {"machine|b": {hs, t}} ; nom : traduit un ancien nom de machine.
  // Une machine renommée peut avoir une déclaration sous son ancien nom : la plus récente (t) l'emporte.
  function hsDe(bhs,nom){
    var t={},o={};Object.keys(bhs||{}).forEach(function(k){var i=k.lastIndexOf('|'),m=nom?nom(k.slice(0,i)):k.slice(0,i),x=bhs[k],c=m+'|'+k.slice(i+1);
      if(x&&(!t[c]||x.t>t[c].x.t))t[c]={m:m,b:k.slice(i+1),x:x}});
    Object.keys(t).forEach(function(c){var y=t[c];if(y.x.hs)(o[y.m]=o[y.m]||{})[y.b]=y.x});
    return o;
  }
  function brochesDe(nb){var o={};Object.keys(nb||{}).forEach(function(m){var n=Math.round(Number(nb[m])||0);if(n>1){o[m]=[];for(var i=1;i<=n;i++)o[m].push(String(i))}});return o}
  // Réponses d'une maintenance enregistrée, broche par broche. Ancienne entrée (sans « broches ») terminée : toutes les
  // broches faites ; non terminée : aucune réponse.
  function reponses(e,ax){
    if(e.broches&&typeof e.broches==='object'&&Object.keys(e.broches).length)return e.broches;
    var o={};if(e.result==='ok')ax.forEach(function(b){o[b]={rep:'f',raison:''}});return o;
  }
  // Passages d'une même maintenance : le premier, puis ses reprises (suite = id du premier). date = jour du premier
  // passage : une reprise faite plus tard compte pour l'échéance où la maintenance a commencé (décision 2026-10-16).
  // Relecture m2 (2026-10-16) : le résultat est gardé pour CE journal (même tableau, même longueur) : la fiche machine
  // et l'écran télé appellent groupes() des dizaines de fois par calcul. Un nouvel état (nouveau tableau, entrée ajoutée
  // ou retirée) repart de zéro. Les entrées ne changent pas une fois enregistrées.
  var memo=typeof WeakMap==='function'?new WeakMap():null;
  function groupes(st,fid,m,ax){
    var j=st.journal,c=memo&&memo.get(j),k=fid+'\u0001'+m+'\u0001'+ax.join(',');
    if(!c||c.n!==j.length){c={n:j.length,par:null,r:{}};if(memo)memo.set(j,c)}
    if(!c.r[k])c.r[k]=groupesCalc(st,fid,m,ax,c);
    return c.r[k];
  }
  function groupesCalc(st,fid,m,ax,c){
    // Entrées rangées une fois par opération et machine pour tout le calcul.
    if(!c.par){c.par={};st.journal.forEach(function(e){var q=e.fid+'\u0001'+e.machine;(c.par[q]=c.par[q]||[]).push(e)})}
    var ids={},par={},l=[];
    (c.par[fid+'\u0001'+m]||[]).forEach(function(e){ids[e.id]=e});
    Object.keys(ids).forEach(function(id){var e=ids[id],g=e.suite&&ids[e.suite]?e.suite:e.id;(par[g]=par[g]||[]).push(e)});
    Object.keys(par).forEach(function(g){
      var es=par[g].sort(function(x,y){return x.end-y.end}),p=ids[g],rep={};
      es.forEach(function(e){var r=reponses(e,ax);Object.keys(r).forEach(function(b){rep[b]={rep:r[b].rep,raison:r[b].raison||'',e:e}})});
      l.push({id:g,date:S(new Date(p.end)),debut:p.start,fin:es[es.length-1].end,entrees:es,rep:rep});
    });
    return l.sort(function(x,y){return x.debut-y.debut||(x.id<y.id?-1:1)});
  }
  // État broche par broche d'une occurrence (même fenêtre que faite) :
  // {tour, axes, br:[{b, st:'ok'|'p'|'hs'|'todo', e, raison}], n (faites), tot (sans les hors service), fini, commence, e}.
  function brochesOcc(st,o,m,suivante,precedente){
    var ax=axesM(st,m),rep={},der=null;
    groupes(st,o.op.id,m,ax).forEach(function(g){
      if(!((precedente?g.date>precedente:g.date>=o.date)&&(!suivante||g.date<suivante)))return;
      // Une réponse définitive (faite, pas faite, hors service) n'est pas effacée par un « à reprendre » ; sinon la plus récente.
      Object.keys(g.rep).forEach(function(b){var x=g.rep[b],y=rep[b];if(!y||(x.rep!=='r'||y.rep==='r')&&(y.rep==='r'||x.e.end>=y.e.end))rep[b]=x});
      g.entrees.forEach(function(e){if(!der||e.end>der.end)der=e});
    });
    if(o.op.broches==='tour')return tourOcc(st,o.op,m,ax,rep,der);
    var br=ax.map(function(b){var x=rep[b],r=x&&x.rep;return {b:b,st:r==='f'?'ok':r==='p'?'p':r==='h'?'hs':horsService(st,m,b)?'hs':'todo',e:x?x.e:null,raison:x?x.raison:''}});
    var tot=0,n=0,clos=0;br.forEach(function(x){if(x.st!=='hs')tot++;if(x.st==='ok')n++;if(x.st==='ok'||x.st==='p')clos++});
    return {tour:false,axes:ax,br:br,n:n,tot:tot,fini:clos===tot,commence:!!der,e:der};
  }
  // Une broche à tour de rôle : faite dès qu'une broche a « faite » ou « pas faite » ; sinon, la broche du tour.
  function tourOcc(st,f,m,ax,rep,der){
    var b='';Object.keys(rep).forEach(function(k){var r=rep[k].rep;if((r==='f'||r==='p')&&(!b||rep[k].e.end>rep[b].e.end))b=k});
    if(b)return {tour:true,axes:ax,br:[{b:b,st:rep[b].rep==='f'?'ok':'p',e:rep[b].e,raison:rep[b].raison}],n:rep[b].rep==='f'?1:0,tot:1,fini:true,commence:true,e:der};
    var d=brocheDuTour(st,f,m,0);
    return {tour:true,axes:ax,br:d?[{b:d,st:'todo',e:null,raison:''}]:[],n:0,tot:d?1:0,fini:!d,commence:!!der,e:der};
  }
  // Broche du tour : celle qui suit la dernière broche faite (ou pas faite), en sautant les hors service ;
  // decalage = 1 pour l'échéance d'après, 2 pour la suivante… '' si toutes sont hors service.
  function brocheDuTour(st,f,m,decalage){
    var ax=axesM(st,m),der='',t=-1,i,n=decalage||0,k;
    groupes(st,f.id,m,ax).forEach(function(g){Object.keys(g.rep).forEach(function(b){var x=g.rep[b];if((x.rep==='f'||x.rep==='p')&&x.e.end>=t&&ax.indexOf(b)>=0){t=x.e.end;der=b}})});
    i=ax.indexOf(der);
    for(k=0;k<ax.length*(n+2);k++){i=(i+1)%ax.length;if(!horsService(st,m,ax[i])){if(!n)return ax[i];n--}}
    return '';
  }
  // Maintenances commencées dont des broches restent « à reprendre » : le dernier passage de chaque broche dit
  // « à reprendre », et aucun passage plus récent ne l'a faite (ni dite pas faite). Hors service : sortie du compte.
  function ouvertes(st,f,m){
    var ax=axesM(st,m);if(!ax.length||!parBroche(f))return [];
    var gs=groupes(st,f.id,m,ax),out=[];
    gs.forEach(function(g,k){
      // Passage fait du temps où l'opération était « une broche à tour de rôle » (une seule broche répondue) : plus à reprendre
      // une fois l'opération repassée en « toutes les broches » (la prochaine maintenance les fait toutes), 2026-10-16.
      if(f.broches!=='tour'&&Object.keys(g.rep).length===1&&ax.filter(function(b){return !horsService(st,m,b)}).length>1&&g.entrees.every(function(e){return e.broches}))return;
      var reste=ax.filter(function(b){var x=g.rep[b],j,y;if(!x||x.rep!=='r'||horsService(st,m,b))return false;
        for(j=k+1;j<gs.length;j++){y=gs[j].rep[b];if(y&&(y.rep==='f'||y.rep==='p'))return false}return true});
      if(reste.length)out.push({g:g,reste:reste,br:ax.filter(function(b){return g.rep[b]||reste.indexOf(b)>=0}).map(function(b){var x=g.rep[b],r=x&&x.rep;
        return {b:b,st:reste.indexOf(b)>=0?'todo':r==='f'?'ok':r==='p'?'p':r==='h'||horsService(st,m,b)?'hs':'ok',e:x?x.e:null,raison:x?x.raison:''}})});
    });
    return out;
  }
  // Le jour d'un premier passage tombe-t-il dans la fenêtre de l'occurrence l[i] (comme faite : après la précédente) ?
  function dansFenetre(date,l,i){return i>=0&&(i>0?date>l[i-1].date:date>=l[i].date)&&(!l[i+1]||date<l[i+1].date)}
  // Fiche machine : pour chaque opération suivie broche par broche sur la machine, chaque broche avec sa dernière fois
  // faite, sa prochaine échéance et son état (ok | jour | bientot | retard | hs | na).
  function ficheBroches(st,m,now){
    var ax=axesM(st,m);if(!ax.length)return [];
    now=now||Date.now();var today=auj(now),occ=[],par={},out=[];
    try{occ=st.cal&&st.cal.regles.length?occurrences(st,ajoute(today,-60),ajoute(today,150)):[]}catch(e){occ=[]}
    occ.forEach(function(o){if(o.date&&o.machines.indexOf(m)>=0&&suivi(st,o.op,m)){var p=par[o.op.id]=par[o.op.id]||{f:o.op,l:[]};if(!p.l.some(function(x){return x.date===o.date}))p.l.push(o)}});
    st.ops.forEach(function(f){
      if(!suivi(st,f,m)||f.aucune)return;
      var p=par[f.id],l=p?p.l.sort(function(a,b){return a.date<b.date?-1:1}):[],i=-1,j,gs=groupes(st,f.id,m,ax),ouv=ouvertes(st,f,m);
      if((f.machines||[]).length&&f.machines.indexOf(m)<0)return;
      for(j=0;j<l.length;j++)if(l[j].date<=today)i=j;

// Appels au script Google : POST en text/plain (pas de demande préalable du navigateur), sans cookie.
async function appel(op,extra){
  if(!URL_SCRIPT)throw new Error('Adresse du script Google absente.');
  const corps={console:Object.assign({op:op},S.jeton&&op!=='connexion'?{jeton:S.jeton}:{},extra||{})};
  let r;const t0=Date.now();
  try{r=await fetch(URL_SCRIPT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(corps),redirect:'follow',credentials:'omit',cache:'no-store'})}
  catch(e){noterGoogle(navigator.onLine===false?'internet':'injoignable','connexion impossible');throw new Error('Pas de connexion avec Google. Vérifiez internet, puis réessayez.')}
  let j=null;try{j=await r.json()}catch(e){}
  if(!j||typeof j.status!=='number'){noterGoogle('script','réponse illisible (HTTP '+r.status+')');throw new Error('Google ne répond pas correctement. Réessayez dans un instant.')}
  noterReponseGoogle(j,Date.now()-t0);
  // Session terminée (10 min sans activité, accès coupé, code changé…) : retour à l'écran de connexion.
  if(j.status===401&&op!=='connexion'){finSession((j.data&&j.data.error)||'Session terminée : reconnectez-vous.');throw new Error('session')}
  return j;
}
// Lecture gardée 60 s (même opération, mêmes paramètres) ; « Actualiser » vide tout.
// Vitesse (2026-10-16) : une lecture plus ancienne (moins de 15 min) est affichée tout de suite et relue en arrière-plan
// (témoin « mise à jour… ») ; la page se redessine si les données ont changé et que personne n'est en train de saisir.
// Une même lecture n'est jamais demandée deux fois en même temps. Mémoire de la page seulement (rien dans le navigateur).
// Toute écriture vide S.charge (nouvel objet) : une lecture lancée avant l'écriture n'y est alors jamais rangée.
const perime=()=>Date.now()-60001;
const FRAIS_MS=60000,GARDE_MS=15*60000,ENCOURS={},IDS_CHARGE=new WeakMap();
const idCharge=()=>{let i=IDS_CHARGE.get(S.charge);if(!i){i=alea(8);IDS_CHARGE.set(S.charge,i)}return i};
async function lire(op,extra){
  const cle=op+'|'+JSON.stringify(extra||{}),g=S.charge[cle];
  if(g&&Date.now()-g.t<FRAIS_MS)return g.r;
  if(g&&Date.now()-g.t<GARDE_MS){relireFond(cle,op,extra);return g.r}
  return chercher(cle,op,extra);
}
function chercher(cle,op,extra){
  const base=S.charge,k=cle+'#'+idCharge(),g0=GEN[cle]||0;
  if(ENCOURS[k])return ENCOURS[k];
  return ENCOURS[k]=appel(op,extra).then(j=>{
    const r={ok:j.status===200,status:j.status,data:j.data||{},error:j.data&&j.data.error||''};
    // Relecture m1 : une lecture partie AVANT un envoi confirmé de la même clé est plus ancienne que lui : ignorée.
    if(r.ok&&(GEN[cle]||0)!==g0)return S.charge[cle]?S.charge[cle].r:Object.assign(r,{data:surcouche(cle,CONF[cle]?clone(CONF[cle]):r.data)});
    // Données confirmées par Google (base des envois) ; à l'écran, les enregistrements en attente y sont réappliqués.
    if(r.ok)CONF[cle]=JSON.parse(JSON.stringify(r.data));
    if(r.ok)r.data=surcouche(cle,r.data);
    if((r.ok||r.status===403)&&S.charge===base)S.charge[cle]={t:Date.now(),r:r};
    S.maj=Date.now();
    return r;
  }).finally(()=>{delete ENCOURS[k]});
}

function saisieEnCours(){

// Enregistrements en temps masqué (demande de l'utilisateur, 2026-10-16). Un enregistrement s'affiche tout de suite et
// la fiche se ferme ; l'envoi à Google part derrière, par une FILE (un envoi à la fois, dans l'ordre). Les contrôles du
// script restent les mêmes : chaque envoi part de la version confirmée par Google que la personne avait sous les yeux
// (« depuis », versions des éléments). Une version changée par CETTE page (envoi précédent) est suivie (SUITE) ; changée
// ailleurs : conflit, la modification est gardée → « Réappliquer » ou « Abandonner ». Réseau coupé : nouveaux essais.
// Mémoire de la page seulement. Tâche : {cle, op, libelle, page, construire(base)→corps, vue(données)→données,
// esp/version(base)/vu (contrôle de version), nouvelle(réponse, corps)→version écrite, apres(réponse, base)→données
// confirmées (sinon relecture), pack (écriture de la configuration du pack), reprise() (rouvre la saisie)}.
const CONF={},SUITE={},GEN={},ENVOI={file:[],actif:null,ok:0,erreur:null,conflit:null,essais:0,minuterie:0,pause:'',sortie:false};
const suite=(esp,v)=>{let x=v,n=0;while(SUITE[esp+'|'+x]!==undefined&&n++<100)x=SUITE[esp+'|'+x];return x};
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
// Relecture m5 : élément changé et pas encore confirmé → repère « ◐ pas encore enregistré » (_attente, jamais envoyé).
const sansRepere=o=>JSON.stringify(o,(k,x)=>k==='_attente'||k==='modifiable'?undefined:x);
function marquer(avant,l){const m={};(avant||[]).forEach(x=>{if(x&&x.id)m[x.id]=x});return l.map(x=>!x||(x.id&&m[x.id]&&sansRepere(m[x.id])===sansRepere(Object.assign({},m[x.id],x)))?x:Object.assign({},x,{_attente:true}))}
const repere=o=>o&&o._attente?' <span class="tag attente" title="Envoi vers Google en cours">◐ pas encore enregistré</span>':'';
const enAttente=()=>(ENVOI.actif?1:0)+ENVOI.file.length+(ENVOI.conflit?1:0);
// Données à l'écran : la version confirmée + les enregistrements pas encore confirmés.
function surcouche(cle,d){
  let x=d;[ENVOI.conflit,ENVOI.actif].concat(ENVOI.file).forEach(t=>{if(t&&t.cle===cle){try{x=t.vue(clone(x))||x}catch(e){}}});
  return x;
}
function afficherConf(cle){
  const g=S.charge[cle],d=CONF[cle];
  if(d)S.charge[cle]={t:g?g.t:Date.now(),r:{ok:true,status:200,data:surcouche(cle,clone(d)),error:''}};
}
// Mise en file : affichage immédiat (la page se redessine aussitôt), envoi derrière.
function enregistrer(t){
  t.qui=S.moi&&S.moi.nom;t.n=alea(6);
  if(!CONF[t.cle]&&S.charge[t.cle])CONF[t.cle]=clone(S.charge[t.cle].r.data);
  if(t.version&&t.vu===undefined)t.vu=CONF[t.cle]?t.version(CONF[t.cle]):undefined;
  ENVOI.file.push(t);ENVOI.erreur=null;
  afficherConf(t.cle);majEnvoi();
  setTimeout(pousserEnvoi,0);
}
async function relireConf(cle){const [op,ex]=[cle.slice(0,cle.indexOf('|')),JSON.parse(cle.slice(cle.indexOf('|')+1))];S.charge[cle]&&(S.charge[cle].t=0);const r=await chercher(cle,op,ex);if(!r.ok)throw Object.assign(new Error(r.error||'Lecture impossible.'),{refus:r.status})}
async function pousserEnvoi(){
  if(ENVOI.actif||ENVOI.pause||ENVOI.conflit||!ENVOI.file.length)return;
  if(!S.jeton||!S.moi){ENVOI.pause='session';majEnvoi();return}
  const t=ENVOI.actif=ENVOI.file.shift();majEnvoi();
  try{
    let base=CONF[t.cle];
    if(t.version){
      const v=suite(t.esp,t.vu);
      if(!base||t.version(base)!==v){await relireConf(t.cle);base=CONF[t.cle]}
      if(!base||t.version(base)!==v){conflit(t,'modifié ailleurs : la version a changé entre-temps (tablette ou autre console).');return}
    }else if(!base){await relireConf(t.cle);base=CONF[t.cle]}
    // Repère « pas encore enregistré » (_attente) : jamais envoyé.
    const corps=JSON.parse(JSON.stringify(t.construire(clone(base)),(k,x)=>k==='_attente'?undefined:x)),j=await appel(t.op,corps);
    if(j.status===200){
      ENVOI.essais=0;ENVOI.ok=Date.now();
      const av=t.version?t.version(base):undefined;let nv=t.nouvelle&&t.esp?t.nouvelle(j,corps):undefined;
      const d=t.apres?t.apres(j,clone(base)):null;
      ENVOI.actif=null;GEN[t.cle]=(GEN[t.cle]||0)+1;
      if(d){CONF[t.cle]=d;afficherConf(t.cle)}else{S.charge[t.cle]&&(S.charge[t.cle].t=perime())}
      // Relecture m3 : pas de nouvelle version dans la réponse → celle de la relecture sert de suite.
      if(t.esp&&av!==undefined&&nv===undefined){await relireConf(t.cle).catch(()=>{});if(CONF[t.cle])nv=t.version(CONF[t.cle])}
      if(t.esp&&nv!==undefined&&av!==undefined&&nv!==av)SUITE[t.esp+'|'+av]=nv;
      if(t.esp&&av===undefined&&nv!==undefined)SUITE[t.esp+'|0']=nv; // création suivie d'une modification avant confirmation
      // Configuration du pack : les autres lectures du pack seront relues (affichées tout de suite, relues derrière).
      if(t.pack)Object.keys(S.charge).forEach(k=>{if(k!==t.cle&&/^(personnes|parc|messages|droits|administration|site)-lire\|/.test(k))S.charge[k].t=perime()});
      if(t.refus)t.refus(j);
    // 409 « version » (changé ailleurs entre-temps) : conflit ; les autres 409 (nom déjà pris…) sont des refus.
    }else if(j.status===409&&/entre-temps|modifié ailleurs/i.test((j.data&&j.data.error)||'')){ENVOI.actif=null;await relireConf(t.cle).catch(()=>{});
      // Relecture m2 : après une coupure, l'envoi précédent a pu arriver chez Google sans réponse ; si la modification y
      // est déjà, c'est un succès (pas de faux conflit).
      if(t.reseau&&dejaApplique(t)){ENVOI.essais=0;ENVOI.ok=Date.now();GEN[t.cle]=(GEN[t.cle]||0)+1;afficherConf(t.cle)}
      else{conflit(t,'modifié ailleurs : la version a changé entre-temps (tablette ou autre console).');return}}
    else{ENVOI.actif=null;await relireConf(t.cle).catch(()=>{});
      const m=(j.data&&j.data.error)||'Enregistrement refusé.';
      if(t.reseau&&dejaApplique(t)){ENVOI.ok=Date.now();afficherConf(t.cle)}
      else ENVOI.erreur={t,message:(t.reseau&&j.status===409?'peut-être déjà enregistré (la connexion a été coupée pendant l’envoi) : vérifiez. ':'')+m,refus:true}}
  }catch(e){
    ENVOI.actif=null;
    if(e.message==='session'){ENVOI.file.unshift(t);ENVOI.pause='session';majEnvoi();return}
    if(e.refus){ENVOI.erreur={t,message:e.message,refus:true}}
    else{
      // Réseau : la tâche reste en tête ; nouveaux essais après 2, 4, 8, 16 s, puis toutes les 30 s avec un bandeau.
      ENVOI.file.unshift(t);ENVOI.essais++;t.reseau=true;

      if(ENVOI.essais>4)ENVOI.erreur={reseau:true,message:'Pas de connexion avec Google.'};
      clearTimeout(ENVOI.minuterie);ENVOI.minuterie=setTimeout(()=>{ENVOI.minuterie=0;pousserEnvoi()},att);ENVOI.prochain=Date.now()+att;

    }
  }
  majEnvoi();rafraichirApresEnvoi(t);
  if(!ENVOI.file.length&&ENVOI.sortie){ENVOI.sortie=false;seDeconnecter()}
  setTimeout(pousserEnvoi,0);
}
// « Vous êtes toujours là ? » (en ligne, 10 min sans geste avec des envois en attente) : cache toute la console.
function afficherAbsent(){
  let d=document.getElementById('absent');

function continuerPresence(){S.absent=0;S.dernierGeste=Date.now();const d=document.getElementById('absent');if(d)d.remove();if(ENVOI.pause==='absent')ENVOI.pause='';majEnvoi();pousserEnvoi()}
// La modification d'une tâche est-elle déjà dans la version confirmée ? (listes comparées sans tenir compte de l'ordre
// ni du repère « pas encore enregistré »)
function canonEnvoi(o){
  if(Array.isArray(o)){const l=o.map(canonEnvoi);return l.every(x=>x&&typeof x==='object'&&'id' in x)?l.sort((a,b)=>String(a.id).localeCompare(String(b.id))):l}
  if(o&&typeof o==='object'){const r={};Object.keys(o).sort().forEach(k=>{if(k!=='_attente'&&k!=='modifiable')r[k]=canonEnvoi(o[k])});return r}

}
function dejaApplique(t){const b=CONF[t.cle];if(!b)return false;try{return JSON.stringify(canonEnvoi(t.vue(clone(b))))===JSON.stringify(canonEnvoi(b))}catch(e){return false}}
// Relecture m4 : une autre personne se connecte sur cette page → rien de la précédente ne sert de base.
function changerPersonne(nom){

// Écriture directe (code de la console, coupure d'un accès, retrait d'un appareil) : après les enregistrements en file.
function attendreFile(){return new Promise(ok=>{const v=()=>(ENVOI.actif||ENVOI.file.length)&&!ENVOI.conflit&&!ENVOI.erreur&&!ENVOI.pause?setTimeout(v,100):ok();v()})}

function actionEnvoi(b){
  const act=b.dataset.envoi,c=ENVOI.conflit,e=ENVOI.erreur;
  if(act==='continuer'){continuerPresence();return}
  if(act==='reappliquer'&&c){ENVOI.conflit=null;c.vu=c.version?c.version(CONF[c.cle]||{}):undefined;ENVOI.file.unshift(c);majEnvoi();pousserEnvoi();return}
  if(act==='abandonner'&&c){ENVOI.conflit=null;afficherConf(c.cle);if(c.abandon)c.abandon();majEnvoi();rafraichirApresEnvoi(c);pousserEnvoi();return}
  if(act==='reessayer'){ENVOI.erreur=null;ENVOI.essais=0;clearTimeout(ENVOI.minuterie);ENVOI.minuterie=0;majEnvoi();pousserEnvoi();return}
  if(act==='voir'){const t=c||(e&&e.t);if(t&&t.page){S.page=t.page;render()}return}
  if(act==='reprendre'&&e&&e.t.reprise){ENVOI.erreur=null;S.page=e.t.page;e.t.reprise();render();return}

// Fermer ou recharger la page avec des envois en attente : le navigateur demande confirmation.
addEventListener('beforeunload',e=>{if(enAttente()){e.preventDefault();e.returnValue=''}});
// Reprise après une reconnexion : seulement les enregistrements de la même personne.
function reprendreEnvois(){

  if(autres.length){ENVOI.file=ENVOI.file.filter(t=>t.qui===(S.moi&&S.moi.nom));ENVOI.erreur={t:autres[0],message:autres.length+' enregistrement(s) d’une autre personne abandonné(s).',refus:true}}

// Inactivité : 10 minutes sans geste → déconnexion (la page s'actualise toute seule, ce qui ne compte pas comme un geste).
['pointerdown','keydown','wheel','touchstart'].forEach(t=>addEventListener(t,()=>{S.dernierGeste=Date.now()},{passive:true}));
setInterval(()=>{
  if(!S.jeton)return;
  // Console du PC (2026-10-16) : la session reste ouverte tant que la page est ouverte (la session Windows protège ce
  // PC) ; un petit appel toutes les 5 minutes la garde vivante chez Google (plafond de 6 h du script inchangé).
  // Ailleurs : déconnexion après 10 minutes sans activité, mais jamais avec des enregistrements en attente.
  if(CONSOLE_PC){if(Date.now()-(S.vivant||0)>5*60000){S.vivant=Date.now();appel('moi').catch(()=>{})}}
  else if(S.absent){
    // Relecture I1 : 10 minutes de plus sans réponse → déconnexion ; les enregistrements non partis sont perdus.
    if(Date.now()-S.absent>=INACTIF_MS){const n=enAttente();ENVOI.file=[];ENVOI.conflit=null;ENVOI.erreur=null;ENVOI.pause='';S.absent=0;
      seDeconnecter('Déconnecté après 20 minutes sans activité.'+(n?' '+n+' enregistrement(s) n’étai(en)t pas encore parti(s) vers Google : ils sont perdus, refaites-les.':''))}
    return;
  }
  else if(Date.now()-S.dernierGeste>=INACTIF_MS){
    if(!enAttente()){seDeconnecter('Déconnecté après 10 minutes sans activité.');return}
    // Relecture I1 (en ligne) : envois en attente → plus d'actualisation ni de nouvel essai ; les données sont masquées
    // derrière « Vous êtes toujours là ? » (bouton Continuer).
    S.absent=Date.now();ENVOI.pause='absent';clearTimeout(ENVOI.minuterie);ENVOI.minuterie=0;afficherAbsent();return;
  }
  // Vue d'ensemble et lancements : actualisés toutes les 60 s tant que la personne est là.
  // Pas pendant une saisie (numéro de fichier en cours de frappe, formulaire…).
  const saisie=[...document.querySelectorAll('#page input,#page textarea')].some(i=>i===document.activeElement||(i.type!=='file'&&i.type!=='checkbox'&&i.value));
  // (réactivité 2026-10-16 : lectures marquées anciennes → affichées telles quelles, relues derrière, page mise à jour)
  if((S.page==='accueil'||S.page==='lancements')&&!saisie&&!S.edit&&Date.now()-S.maj>60000){Object.values(S.charge).forEach(g=>{g.t=perime()});chargerPage()}
  // Témoin « Google » : petite vérification si rien n'a été échangé depuis 2 min 30 (la personne est là).
  const dernier=Math.max(S.google.ok,S.google.erreur?S.google.erreur.at:0);
  if(document.visibilityState==='visible'&&Date.now()-dernier>150000)appel('site-lire').catch(()=>{});
  majTemoin();
},15000);

// Temps masqué (2026-10-16) : changer(machines) / types appliqués à l'écran tout de suite, puis à la version confirmée.
function envoyerParc(libelle,changer,types,supprimer){
  // supprimer : suppressions EXPLICITES (le script refuse une machine simplement absente de la liste).
  const edit=clone(S.edit),ty=clone(S.types);
  const machinesDe=d=>((d.parc||{}).machines||[]).filter(m=>!/^tmp-/.test(m.id||''));
  enregistrer(tachePack({cle:'parc-lire|{}',op:'parc-ecrire',page:'parc',libelle,
    construire:d=>Object.assign({machines:changer(machinesDe(d)).map(m=>{const x=Object.assign({},m);if(/^tmp-/.test(x.id||''))delete x.id;return x}),depuis:Number(d.maj)||0},types?{types}:{},supprimer?{supprimer}:{}),
    vue:d=>{if(!d.parc)return d;const tmp=d.parc.machines.filter(m=>/^tmp-/.test(m.id||''));d.parc.machines=marquer(machinesDe(d),changer(machinesDe(d))).map(m=>m.id?m:Object.assign({},m,{id:'tmp-'+alea(8)})).concat(tmp);if(types)d.parc.types=types.map(y=>Object.assign({id:y.id||'tmp-'+alea(6)},y));return d},
    apres:j=>j.data,reprise:edit||ty?()=>{S.edit=edit;S.types=ty}:null}));
  S.edit=null;S.types=null;S.suppr=null;S.msgParc=null;
}
async function actionParc(b){
  const act=b.dataset.pe,r=await lire('parc-lire');if(!r.ok)return chargerPage();
  const toutes=r.data.parc?r.data.parc.machines:[];
  if(act==='nouveau'){S.edit={cle:'parc',nouveau:true,item:machineVersBrouillon({secteur:unSecteur()||(r.data.secteurs||[])[0]||'',actif:true}),sale:true};S.msgParc=null;return chargerPage()}
  if(act==='modifier'){const m=toutes.find(x=>x.id===b.dataset.id);if(m){S.edit={cle:'parc',nouveau:false,item:machineVersBrouillon(m),nomAvant:m.nom,sale:false};S.msgParc=null}return chargerPage()}
  if(act==='annuler'||act==='recharger'){S.edit=null;S.types=null;if(act==='recharger')delete S.charge['parc-lire|{}'];S.msgParc=act==='recharger'?['info','Parc rechargé.']:null;return chargerPage()}
  if(act==='enregistrer'){
    const m=brouillonVersMachine(S.edit.item);
    if(!String(m.nom).trim()){S.edit.msg=['err','<b>Donnez un nom à la machine.</b>'];return chargerPage()}
    // Renommage : l'ancien nom est gardé (le script le fait aussi).
    if(!S.edit.nouveau&&S.edit.nomAvant&&S.edit.nomAvant.toLocaleLowerCase('fr')!==String(m.nom).trim().toLocaleLowerCase('fr'))m.anciens=(m.anciens||[]).concat(S.edit.nomAvant);
    const nouveau=S.edit.nouveau;
    envoyerParc('machine « '+m.nom+' »',l=>nouveau?l.concat(m):l.map(x=>x.id===m.id?m:x),null);
    if(m.id)S.sel.parc=m.id;
    return chargerPage();
  }
  if(act==='supprimer'){S.suppr=b.dataset.id;return chargerPage()}
  if(act==='supprimer-non'){S.suppr=null;return chargerPage()}
  if(act==='supprimer-ok'){const m=toutes.find(x=>x.id===S.suppr),id=S.suppr;envoyerParc('suppression de « '+(m?m.nom:'')+' »',l=>l.filter(x=>x.id!==id),null,[id]);S.sel.parc='';return chargerPage()}
  if(act==='types'){S.types={liste:JSON.parse(JSON.stringify((r.data.parc||{}).types||[])),avant:{}};S.types.liste.forEach(y=>S.types.avant[y.id]=y.nom);return chargerPage()}
  if(act==='types-annuler'){S.types=null;return chargerPage()}
  if(act==='type-plus'){S.types.liste.push({nom:'',broches:0});return chargerPage()}
  if(act==='type-moins'){S.types.liste.splice(+b.dataset.i,1);return chargerPage()}
  if(act==='types-enregistrer'){
    const l=S.types.liste.filter(y=>String(y.nom).trim()).map(y=>{const a=y.id&&S.types.avant[y.id];return Object.assign({},y,{broches:Number(y.broches)||0,anciens:(y.anciens||[]).concat(a&&a!==y.nom?[a]:[])})});
    envoyerParc('types de machine',x=>x,l);return chargerPage();
  }
}

// Alertes (mêmes règles que l'ancienne console) ; « Ignorer » est gardé sur ce PC (/api/alertes-ignorees).
const dateVu=v=>{const m=/(\d\d)\/(\d\d)\/(\d{4}) (\d\d):(\d\d)/.exec(v||'');return m?new Date(+m[3],m[2]-1,+m[1],+m[4],+m[5]).getTime():0};
function alertesTablettes(l,site){
  const a=[],H=3600000,now=Date.now();
  for(const t of l.filter(t=>!!t.version&&t.version!=='fichier')){
    const vu=dateVu(t.vu),age=vu?now-vu:Infinity,e=t.etat||'';
    if(age>30*24*H)continue;
    if(age>24*H)a.push({cle:t.id+'|vu|'+t.vu,niv:age>72*H?'err':'att',t,texte:'pas connectée depuis '+(age>48*H?Math.round(age/24/H)+' jours':Math.round(age/H)+' h')+' (vue le '+t.vu+')'});
    if(/^à envoyer/.test(e))a.push({cle:t.id+'|attente|'+e.split(' · ')[0],niv:age>2*H?'err':'att',t,texte:'données pas encore envoyées à Google : '+e.split(' · ')[0].replace(/^à envoyer : /,'')+(age>2*H?' — et la tablette ne se connecte plus':'')});
    if(/hors ligne NON prêt/.test(e))a.push({cle:t.id+'|hl',niv:'err',t,texte:'ne fonctionnera pas sans internet (copie hors ligne absente) : rouvrir le pack une fois avec internet'});
    if(site&&site.id){const cn=(site.tablettes||{})[t.id],c=cn&&cn.canal==='bloquee'?null:cn&&cn.canal==='test'&&site.test?site.test.id:site.id;
      if(c&&t.version!==c&&age<24*H)a.push({cle:t.id+'|version|'+c,niv:'att',t,texte:'pas encore sur la version '+c+' (a la '+t.version+')'})}
    const pl=/· (\d+(?:,\d)?) (Ko|Mo|Go) \/ (\d+(?:,\d)?) (Ko|Mo|Go)/.exec(e);
    if(pl){const o=(n,u)=>parseFloat(n.replace(',','.'))*{Ko:1e3,Mo:1e6,Go:1e9}[u];if(o(pl[1],pl[2])/o(pl[3],pl[4])>.8)a.push({cle:t.id+'|place',niv:'err',t,texte:'mémoire presque pleine ('+pl[1]+' '+pl[2]+' sur '+pl[3]+' '+pl[4]+')'})}
  }
  return a.sort((x,y)=>(x.niv==='err'?0:1)-(y.niv==='err'?0:1));
}

// Calendrier de maintenance (lot 6, 2026-10-15) : vue semaine, vue mois avec la charge de chacun, et TOUS les réglages
// de l'onglet Calendrier de la console du PC (appli Maintenance) : jours travaillés et fermés, roulement, règles,
// congés et remplaçants. Calculs : le moteur <calendrier> de l'appli (CalMaint), recopié dans cette page.
// Règles « par type » : remplacées par les machines de ces types, comme l'appli (typeFiche / typesAct).
function etatCalendrier(d,calAutre){
  const cal=calAutre||d.cal;
  const st={cal:cal?JSON.parse(JSON.stringify(cal)):null,ops:d.ops||[],journal:d.journal||[],machines:d.machines||[],operators:nomsCalendrier(d)};
  // Broches (fraisage, 2026-10-16) : broches de chaque machine et broches hors service → suivi broche par broche (◐ 2/4).
  if(typeof CalMaint!=='undefined'&&CalMaint.brochesDe){st.broches=CalMaint.brochesDe(d.brochesMachines||{});st.hs=CalMaint.hsDe(d.bhs||{})}
  if(st.cal&&Array.isArray(st.cal.regles)){
    const tm=d.typesMachines||{},ren=d.typesRenommes||{},act=t=>ren[t]||t;
    st.cal.regles=st.cal.regles.map(g=>{
      if(!(g.types||[]).length)return g;
      const f=st.ops.find(o=>o.id===g.op),cands=f&&(f.machines||[]).length?f.machines.filter(m=>st.machines.includes(m)):st.machines,ty=g.types.map(act);
      const l=cands.filter(m=>ty.includes(act(tm[m]||'')));
      return l.length?Object.assign({},g,{machines:l}):null}).filter(Boolean);
  }
  return st;
}
const CAL_VIDE=()=>({maj:0,jours:[1,2,3,4,5],periodes:[],fermes:[],roulement:{mode:'semaine',n:1,debut:'',equipes:[]},regles:[],conges:[],rempl:{},exc:{}});
const JOURS_SEM=[[1,'Lun'],[2,'Mar'],[3,'Mer'],[4,'Jeu'],[5,'Ven'],[6,'Sam'],[0,'Dim']];
const NOMS_JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const QUAND=[['jour','Chaque jour travaillé'],['nj','Un jour travaillé sur N'],['semaine','Chaque semaine (ou toutes les N)'],['mois','Chaque mois']];
function descQuand(q){
  if(q.type==='jour')return 'chaque jour travaillé';

  if(q.type==='semaine')return (q.n>1?'toutes les '+q.n+' semaines':'chaque semaine')+' : '+(q.jours||[]).map(j=>NOMS_JOURS[j]).concat(q.dernier?['dernier jour travaillé']:[]).join(', ');
  return 'chaque mois : '+(q.rang>=5?'le dernier':['','le 1er','le 2e','le 3e','le 4e'][q.rang])+' '+NOMS_JOURS[q.js];

// Occurrences d'une période, avec l'état (faite / en retard / aujourd'hui / prévue) de chaque machine.
function occurrencesEtat(st,du,au){
  const C=CalMaint;let large=[];try{large=C.occurrences(st,C.ajoute(du,-35),C.ajoute(au,35)).filter(o=>o.date)}catch(e){}
  const suite={};large.forEach(o=>o.machines.forEach(m=>{const k=o.regle.id+'|'+m;(suite[k]=suite[k]||[]).push(o)}));
  const faite=(o,m)=>{const l=suite[o.regle.id+'|'+m]||[],i=l.indexOf(o);try{return C.faite(st,o,m,l[i+1]?l[i+1].date:'',i>0?l[i-1].date:'')}catch(e){return null}};
  // Broches : état broche par broche de l'occurrence (null hors fraisage ou sans étape « ↻ »).
  const bro=(o,m)=>{if(!C.suivi||!C.suivi(st,o.op,m))return null;const l=suite[o.regle.id+'|'+m]||[],i=l.indexOf(o);try{return C.brochesOcc(st,o,m,l[i+1]?l[i+1].date:'',i>0?l[i-1].date:'')}catch(e){return null}};
  return {occ:large.filter(o=>o.date>=du&&o.date<=au),faite,bro};
}
// Charge de chacun sur une période : machines à faire par personne (remplaçants compris, validés ou proposés).
function chargePeriode(st,du,au){
  const {occ}=occurrencesEtat(st,du,au),ch={},rempl=[];
  occ.forEach(o=>{(o.noms||[]).forEach(n=>{ch[n]=(ch[n]||0)+o.machines.length});(o.rempl||[]).forEach(r=>rempl.push(Object.assign({date:o.date,op:o.op.title},r)))});
  return {ch,rempl};
}

function vueMois(st,cal){

// Brouillon nettoyé avant l'envoi : listes cohérentes (le script et l'appli le nettoient aussi : bloc <fusion>).
function brouillonCalPropre(c){
  const x=JSON.parse(JSON.stringify(c));
  x.regles=(x.regles||[]).map(g=>{const cib=g.cible;delete g.cible;if(cib==='tout'){g.types=[];g.machines=[]}else if(cib==='type')g.machines=[];else if(cib==='liste')g.types=[];return g});
  return x;
}
function erreurReglages(c){
  for(const p of c.periodes.concat(c.fermes))if(!p.du||!p.au||p.au<p.du)return 'Une période ou un jour fermé n’a pas de dates valides (la fin après le début).';
  for(const e of c.roulement.equipes){if(!String(e.nom||'').trim())return 'Donnez un nom à chaque binôme / équipe.';if(e.personnes.length>6)return '« '+e.nom+' » : 6 personnes au plus.'}
  for(const g of c.regles){if(!g.op)return 'Chaque règle doit avoir une opération.';if(g.qui.type==='fixe'&&!(g.qui.noms.length>=1&&g.qui.noms.length<=4))return 'Règle avec des personnes fixes : choisissez de 1 à 4 personnes.';
    if((g.cible==='type'&&!g.types.length)||(g.cible==='liste'&&!g.machines.length))return 'Règle « par type » ou « liste précise » : cochez au moins un élément.';
    if(g.quand.type==='semaine'&&!g.quand.jours.length&&!g.quand.dernier)return 'Règle « chaque semaine » : choisissez au moins un jour.'}
  for(const c2 of c.conges)if(!c2.nom||!c2.du||!c2.au||c2.au<c2.du)return 'Un congé n’a pas de personne ou de dates valides.';
  return '';
}

async function actionCalendrier(b){
  const E=S.calEd,act=b.dataset.cr;if(!E)return;
  const liste=k=>lireChemin(E.cal,k);
  if(act==='plus'){
    const k=b.dataset.k,auj=CalMaint.auj();
    const neuf={periodes:{du:auj,au:auj,jours:[1,2,3,4,5]},fermes:{du:auj,au:auj,nom:''},'roulement.equipes':{id:'e'+alea(8),nom:'',personnes:[],couleur:'#2F6FDB'},
      regles:{id:'r'+Date.now().toString(36)+alea(4),op:'',cible:'tout',machines:[],types:[],avant:'',acc:false,debut:'',quand:{type:'semaine',n:1,jours:[1],dernier:false,rang:1,js:1},qui:{type:'roulement',noms:[]}},
      conges:{id:'c'+alea(10),nom:(S.calNoms||[])[0]||'',du:auj,au:auj}}[k];
    liste(k).push(neuf);E.sale=true;return chargerPage();
  }
  if(act==='moins'){liste(b.dataset.k).splice(+b.dataset.i,1);E.sale=true;return chargerPage()}
  if(act==='moins-conge'){E.cal.conges=E.cal.conges.filter(c=>c.id!==b.dataset.id);delete (E.cal.rempl||{})[b.dataset.id];E.sale=true;return chargerPage()}
  if(act==='haut'||act==='bas'){const l=liste(b.dataset.k),i=+b.dataset.i,j=act==='haut'?i-1:i+1;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];E.sale=true;return chargerPage()}
  if(act==='annuler'||act==='recharger'){S.calEd=null;if(act==='recharger')Object.keys(S.charge).forEach(k=>{if(/^calendrier-lire\|/.test(k))delete S.charge[k]});S.msgCal=act==='recharger'?['info','Calendrier rechargé.']:null;return chargerPage()}
  if(act==='enregistrer'){
    const err=erreurReglages(E.cal);if(err){E.msg=['err','<b>'+esc(err)+'</b>'];return chargerPage()}
    // Temps masqué (2026-10-16) : les réglages s'affichent tout de suite, envoyés derrière avec la version lue.

    S.calEd=null;S.msgCal=null;
    return chargerPage();
  }
}

// Identifiant tiré au hasard (crypto) : photos, fichiers des lancements, nouveaux éléments.
function alea(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('')}
// Photo choisie sur ce PC : réduite (1600 px, JPEG), envoyée à Google (photo-ecrire), puis son nom est rangé.
async function envoyerPhoto(fichier){
  if(!fichier||!/^image\//.test(fichier.type))throw new Error('Choisissez une image.');
  const bmp=await createImageBitmap(fichier),k=Math.min(1,1600/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');
  cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  let data=cv.toDataURL('image/jpeg',.85);if(data.length>2900000)data=cv.toDataURL('image/jpeg',.6);
  const id='p'+alea(24),j=await appel('photo-ecrire',{id,data});
  if(j.status!==200)throw new Error((j.data&&j.data.error)||'Photo refusée.');
  if(/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(data))S.photos[id]=data;
  return id;
}

function enregistrerContenu(app,sec,page,item,vu,edit,retire){

    esp,vu:vu===null?undefined:vu,version:vu===null?undefined:version,
    construire:d=>{const v=version(d),bases=vu===null?{}:{[id]:taches?{empreinte:v}:{updated:v}};
      return item?{app,secteur:sec,items:[item],bases}:{app,secteur:sec,supprimer:id,bases}},
    vue:d=>{const st=d.state=d.state||{},l=st[A.liste]=st[A.liste]||[],i=l.findIndex(x=>x.id===id);
      if(item){if(i<0)l.push(Object.assign({},item,{_attente:true}));else l[i]=Object.assign({},l[i],item,{_attente:true})}
      else if(i>=0){if(taches)l[i]=Object.assign({},l[i],{archived:true});else l.splice(i,1)}
      return d},
    nouvelle:j=>{const o=(((j.data||{}).state||{})[A.liste]||[]).find(x=>x.id===id);return o?(taches?JSON.stringify(o):(o.updated||0)):undefined},
    apres:(j,base)=>Object.assign({},base,{rev:j.data.rev,state:j.data.state}),
    reprise:edit?()=>{S.edit=edit}:null});
}

      secteurs:B.secteurs,zones:B.zones.map(z=>({id:z.id,nom:z.nom,secteur:z.secteur,applis:z.applis,lienReleve:!!z.lienReleve})),supprimerZones:A.supprimerZones},sauve=clone(A);
    enregistrer(tachePack({cle:'administration-lire|{}',op:'administration-ecrire',page:'apparence',libelle:'Administration et apparence',vu:Number(B.maj)||0,
      construire:d=>Object.assign(clone(c),{depuis:Number(d.maj)||0}),

        zones:c.zones.map(z=>Object.assign({googlePropre:false},(d.zones||[]).find(x=>x.id===z.id)||{},z,{id:z.id||'tmp-'+alea(6)}))}),

// Logo réduit (240 × 120 px au plus, PNG), comme l'Administration des tablettes ; 150 000 caractères au plus.
function admLogo(fichier){return new Promise((ok,ko)=>{if(!fichier||!/^image\//.test(fichier.type))return ko(new Error('Choisissez une image.'));
  createImageBitmap(fichier).then(im=>{const k=Math.min(1,240/im.width,120/im.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/png');d.length>150000?ko(new Error('Image trop lourde, choisissez-en une plus simple.')):ok(d)},()=>ko(new Error('Cette image ne peut pas être lue.')))})}
function saisieAdmin(el){
  const A=S.adm;if(!A)return false;const B=A.b;
  if(el.dataset.adm==='nom')B.nom=el.value;
  else if(el.dataset.adm==='inactivite')B.inactivite=Number(el.value)||0;
  else if(el.dataset.adm==='couleur'){if(!/^#[0-9a-f]{6}$/i.test(el.value))return true;B.apparence.couleur=el.value.toLowerCase()}
  else if(el.dataset.admTuile){const id=el.dataset.admTuile,k=el.dataset.k;B.apparence.tuiles=B.apparence.tuiles||{};B.apparence.tuiles[id]=Object.assign({},B.apparence.tuiles[id],{[k]:el.value})}
  else if(el.dataset.admZone!=null){const z=B.zones[+el.dataset.admZone];if(!z)return true;z[el.dataset.k]=el.value;if(el.dataset.k==='secteur'&&!(B.secteursReleve||[]).includes(el.value)){z.applis=z.applis.filter(a=>a!=='releve');z.lienReleve=false}}
  else return false;

}
async function actionPC(b){
  const act=b.dataset.pc;S.msgPC=null;
  const oui=['test','partout','diffuser','abandon','oubli'];
  if(oui.includes(act)){S.confirmPC=act;return chargerPage()}
  if(act==='revenir'){S.confirmPC='revenir-'+b.dataset.sha;return chargerPage()}
  if(act==='non'){S.confirmPC=null;return chargerPage()}
  S.confirmPC=null;b.disabled=true;
  try{
    if(act==='construire'){const n=document.getElementById('pcNotes');S.msgPC=['info','Construction en cours…'];const r=await apiPC('/api/construire',{notes:n?n.value.trim():''});S.journalPC=(r.journal||[]).join('\n');S.msgPC=['ok','Version '+esc(r.version&&r.version.id)+' construite sur ce PC.']}
    else if(act==='test-ok'||act==='partout-ok'){const r=await apiPC('/api/publier',{mode:act==='test-ok'?'test':'partout'});S.journalPC=(r.journal||[]).join('\n');S.msgPC=['ok',esc(vidPC(r.version))+' publiée '+(act==='test-ok'?'sur la tablette test.':'sur toutes les tablettes.')]}
    else if(act==='diffuser-ok'){await apiPC('/api/diffuser',{});S.msgPC=['ok','Version test diffusée à toutes les tablettes.']}
    else if(act==='abandon-ok'){await apiPC('/api/abandonner-test',{});S.msgPC=['ok','Test abandonné : les tablettes test reprennent la version diffusée.']}
    else if(act==='historique'){S.histoPC=await apiPC('/api/historique')}
    else if(act==='revenir-ok'){await apiPC('/api/revenir',{sha:b.dataset.sha});S.histoPC=null;S.msgPC=['ok','Retour fait : les tablettes reprennent cette version.']}
    else if(act==='reglages'){const v=id=>{const x=document.getElementById(id);return x?x.value:''};
      const go={url:v('pcGoU').trim()},gh={proprietaire:v('pcGhP'),depot:v('pcGhD'),branche:v('pcGhB')};if(v('pcGoC').trim())go.code=v('pcGoC').trim();if(v('pcGhJ').trim())gh.jeton=v('pcGhJ').trim();
      await apiPC('/api/reglages',{github:gh,google:go});S.msgPC=['ok','Liaisons enregistrées.'+(go.url!==GOOGLE_URL_PUBLIE?' Rechargez la page pour utiliser la nouvelle adresse Google.':'')]}
    else if(act==='tester'){const r=await apiPC('/api/tester',{});S.msgPC=['ok','GitHub répond : dépôt '+(r.prive?'privé':'public')+(r.url?' · site '+esc(r.url):'')+'.']}
    else if(act==='oubli-ok'){await apiPC('/api/reglages',{github:{oublierJeton:true}});S.msgPC=['ok','Jeton GitHub effacé de ce PC.']}
  }catch(x){S.msgPC=['err','<b>'+esc(x.message)+'</b>']}
  return chargerPage();
}
// Capture d'écran du plan d'un plateau (outil de capture de Windows), puis envoyée à Google comme une photo.
function imageVersPhoto(data){
  return new Promise((ok,ko)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let d=cv.toDataURL('image/jpeg',.85);if(d.length>2900000)d=cv.toDataURL('image/jpeg',.6);ok(d)};im.onerror=()=>ko(new Error('Capture illisible.'));im.src=data});
}
async function capturePlan(machine,fid){
  S.msgLanc=['info','Entourez le plan du plateau à l’écran (outil de capture de Windows)…'];chargerPage();
  const r=await apiPC('/api/capture',{outil:true});
  if(!r||!/^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(String(r.data||'')))throw new Error('Pas de capture reçue.');
  const data=await imageVersPhoto(r.data),id='p'+alea(24),j=await appel('photo-ecrire',{id,data});
  if(j.status!==200)throw new Error((j.data&&j.data.error)||'Photo refusée.');
  if(/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(data))S.photos[id]=data;
  return envoyerLancements([{type:'modifier',machine,fid,photo:id}],'Capture jointe au fichier.');
}
