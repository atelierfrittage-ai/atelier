// d'un envoi au suivant pour l'élément (SUITE). item null + retire : suppression.
function enregistrerContenu(app,sec,page,item,vu,edit,retire,origine){
  const A=CONTENUS[app],id=item?item.id:retire.id,esp='item|'+app+'|'+sec+'|'+id,taches=app==='taches';
  const trouve=d=>((d.state||{})[A.liste]||[]).find(x=>x.id===id);
  const version=d=>{const o=trouve(d);return o?(taches?JSON.stringify(o):(o.updated||0)):undefined};
  // Modification d'un élément existant : fusion champ par champ (campagne 2026-10-17) à partir de l'élément tel qu'il
  // a été ouvert ; les champs changés ailleurs (tablette) sont gardés.
  if(item&&origine&&vu!==null){
    const champs=o=>{const x=Object.assign({},o||{});delete x.updated;delete x._attente;return x};
    const f={lire:d=>champs(trouve(d)),
      ecrire:(d,p)=>{const st=d.state=d.state||{},l=st[A.liste]=st[A.liste]||[],i=l.findIndex(x=>x.id===id);const o=Object.assign({},i>=0?l[i]:{},p,{id,_attente:true});if(i<0)l.push(o);else l[i]=o;return d},
      corps:(p,d)=>{const v=version(d);return {app,secteur:sec,items:[Object.assign({},p,{id})],bases:{[id]:taches?{empreinte:v}:{updated:v}}}}};
    enregistrer(tacheFusion({cle:'contenu-lire|'+JSON.stringify({app,secteur:sec}),op:'contenu-ecrire',page,libelle:String(item[A.titre]||''),esp,vu,version,
      nouvelle:j=>{const o=(((j.data||{}).state||{})[A.liste]||[]).find(x=>x.id===id);return o?(taches?JSON.stringify(o):(o.updated||0)):undefined},
      apres:(j,base)=>Object.assign({},base,{rev:j.data.rev,state:j.data.state}),reprise:edit?()=>{S.edit=edit}:null},f,()=>champs(item),champs(origine)));
    return;
  }
  enregistrer({cle:'contenu-lire|'+JSON.stringify({app,secteur:sec}),op:'contenu-ecrire',page,libelle:String(item?item[A.titre]||'':('retrait de '+(retire[A.titre]||''))),
    esp,vu:vu===null?undefined:vu,version:vu===null?undefined:version,
    construire:d=>{const v=version(d),bases=vu===null?{}:{[id]:taches?{empreinte:v}:{updated:v}};
      return item?{app,secteur:sec,items:[item],bases}:{app,secteur:sec,supprimer:id,bases}},
    // Premier élément d'un secteur vide (2026-10-19) : l'état affiché pendant l'envoi part de l'état de départ (vierge :
    // catégories, postes), sinon un « Nouveau » ouvert avant la réponse n'aurait plus de catégories à proposer.
    vue:d=>{const st=d.state=d.state||JSON.parse(JSON.stringify(d.vierge||{})),l=st[A.liste]=st[A.liste]||[],i=l.findIndex(x=>x.id===id);
      if(item){if(i<0)l.push(Object.assign({},item,{_attente:true}));else l[i]=Object.assign({},l[i],item,{_attente:true})}
      else if(i>=0){if(taches)l[i]=Object.assign({},l[i],{archived:true});else l.splice(i,1)}
      return d},
    nouvelle:j=>{const o=(((j.data||{}).state||{})[A.liste]||[]).find(x=>x.id===id);return o?(taches?JSON.stringify(o):(o.updated||0)):undefined},
    apres:(j,base)=>Object.assign({},base,{rev:j.data.rev,state:j.data.state}),
    reprise:edit?()=>{S.edit=edit}:null});
}

async function envoyerLancements(actions,msgOk){
  // Identifiant de chaque action tiré ici : un double envoi n'est appliqué qu'une fois par le script (aussi après une
  // coupure du réseau : la file renvoie les mêmes identifiants).
  // Temps masqué (2026-10-16) : la file d'attente change tout de suite à l'écran, envoi derrière.
  const l=actions.map(a=>Object.assign({id:alea(16)},a));void msgOk;
  enregistrer({cle:'lancements-lire|{}',op:'lancements-actions',page:'lancements',libelle:'Lancements ('+l.map(a=>a.num||a.type).join(', ').slice(0,60)+')',
    construire:()=>({actions:l}),
    vue:d=>{const st=d.state=d.state||{},f=st.files=st.files||{};
      l.forEach(a=>{const q=f[a.machine]=(f[a.machine]||[]).slice(),i=q.findIndex(x=>x.id===a.fid);
        if(a.type==='ajouter'&&i<0)q.push({id:a.fid,num:a.num,note:a.note||'',photo:'',_attente:true});
        else if(a.type==='retirer'&&i>=0)q.splice(i,1);
        else if(a.type==='deplacer'&&i>=0){const [x]=q.splice(i,1);q.splice(Math.min(a.pos,q.length),0,x)}
        else if(a.type==='modifier'&&i>=0)q[i]=Object.assign({},q[i],a.photo!=null?{photo:a.photo}:{},a.note!=null?{note:a.note}:{},{_attente:true});
        else if(a.type==='vider-histo')st.histo=[];
        else if(a.type==='etat'&&a.etat==='libre'){st.machines=Object.assign({},st.machines);st.machines[a.machine]={etat:'libre',fichier:null,_attente:true}}});
      return d},
    apres:(j,base)=>Object.assign(base,{rev:j.data.rev,state:j.data.state}),
    refus:j=>{const r=Object.values(j.data.refus||{});if(r.length){ENVOI.erreur={t:{libelle:'Lancements',page:'lancements'},message:'refusé par Google : '+r.join(' ; '),refus:true};S.msgLanc=['err','<b>Pas fait :</b> '+esc(r.join(' ; '))]}}});
  S.msgLanc=null;
  return chargerPage();
}
async function actionLancements(b){

  if(act==='retirer')return envoyerLancements([{type:'retirer',machine:m,fid:b.dataset.fid}],'Fichier retiré de la file.');
  if(act==='plan-retirer')return envoyerLancements([{type:'modifier',machine:m,fid:b.dataset.fid,photo:''}],'Photo retirée.');
  if(act==='libre'){S.remettre=m;return chargerPage()}
  if(act==='libre-non'){S.remettre=null;return chargerPage()}
  if(act==='libre-ok'){S.remettre=null;return envoyerLancements([{type:'etat',machine:m,etat:'libre',vu:{etat:b.dataset.etat,fid:b.dataset.fid||''}}],'Machine remise libre.')}
  if(act==='capture')return capturePlan(m,b.dataset.fid);
  if(act==='vider'){S.viderHisto=true;return chargerPage()}
  if(act==='vider-non'){S.viderHisto=false;return chargerPage()}
  if(act==='vider-ok'){S.viderHisto=false;return envoyerLancements([{type:'vider-histo',avant:Date.now()}],'Historique effacé.')}
}

// <fours-console> Fours (2026-10-22, décisions de l'utilisateur du 22/10) : partie « Fours (minuteurs) » de la console.

  if(!Array.isArray(r.groupes))o.groupes=FOURS_GROUPES.slice();

  return o;
}
var FSOURCES=['lancements','scan','saisie'];
function fcharge(c){
  if(!c||typeof c!=='object'||typeof c.id!=='string'||!FID.test(c.id))return null;
  var num=normNum(c.num),debut=fms(c.debut),duree=fduree(c.duree);if(!num||!debut)return null;

var FMOTIFS=['avant','console','annule'];
function fhisto(h){
  if(!h||typeof h!=='object'||typeof h.id!=='string'||!FID.test(h.id)||typeof h.four!=='string'||!FID.test(h.four))return null;
  var num=normNum(h.num);if(!num||!fms(h.debut))return null;

    machine:ftxt(h.machine,60),debut:fms(h.debut),fin:fms(h.fin),duree:fduree(h.duree),sortie:fms(h.sortie),par:ftxt(h.par,60),parSortie:ftxt(h.parSortie,60),

function normalizeState(s){
  var o={v:1,fours:{},histo:[],reglages:normReglages(null),vus:[]};
  if(!s||typeof s!=='object')return o;

function dureeFour(s,id){var r=s&&s.reglages&&s.reglages.fours&&s.reglages.fours[id];return r?fduree(r.duree):FOURS_DUREE}

//  entrer   {four, fourNom, num, source, machine} : four vide, plateau pas déjà dans un autre four ; durée = réglage du four ;
//  sortir   {four, cid} : cid = plateau vu à l'écran (refus clair s'il n'y est plus) ; heure de sortie notée ;
//  retirer  {four, cid} : erreur de plateau ou de four (« pas de traitement »), noté « annulé » dans l'historique ;
//  remettre {hid}       : sortie notée par erreur (moins de 15 min, four encore vide) : le plateau revient, même minuteur ;
//  reglages {reglages, depuis} : CONSOLE seulement (a.console posé par le script de la console) ; refus si changé ailleurs.

// l'appli (écart gardé), et contrôlée ici (relecture du 22/10) : jamais avant la dernière heure Google connue de l'appareil
// (a.hg : une horloge en retard ne raccourcit pas le traitement), jamais plus de 12 h en arrière ni dans le futur.

  if(!a.hl||!at||at>now+300000||at<now-FOURS_HL_MAX)return now;
  if(hg&&hg<=now+300000&&at<hg)at=hg;
  return Math.min(at,now);
}
function appliquer(s,a,now){
  if(!a||typeof a!=='object'||typeof a.id!=='string'||!FID.test(a.id))return 'action invalide';
  if(s.vus.indexOf(a.id)>=0)return '';
  var at=heureAction(a,now);
  var par=ftxt(a.par,60),c,h,i;
  if(a.type==='reglages'){
    if(a.console!==true)return 'Les réglages des fours se changent dans la console (responsable).';
    if(fms(a.depuis)!==s.reglages.maj)return 'Les réglages des fours ont été changés ailleurs : relisez-les avant de modifier.';
    var r=normReglages(a.reglages);r.maj=Math.max(now,s.reglages.maj+1);r.par=par;s.reglages=r;fvu(s,a);return '';
  }
  if(a.type==='remettre'){
    for(i=s.histo.length-1;i>=0;i--)if(s.histo[i].id===a.hid)break;
    h=i>=0?s.histo[i]:null;
    if(!h||h.motif==='annule')return 'Cette sortie n’est plus dans l’historique : rien n’a été remis.';
    if(s.fours[h.four])return (h.fourNom||'Ce four')+' a déjà un autre plateau ('+s.fours[h.four].num+') : rien n’a été remis.';
    if(now-h.sortie>FOURS_ANNULER)return 'La sortie date de plus de 15 minutes : elle ne peut plus être annulée ici.';
    // Relecture du 22/10 : le plateau a pu être remis dans un autre four entre-temps → jamais dans deux fours.
    for(var k0 in s.fours)if(s.fours[k0].num===h.num)return 'Le plateau '+h.num+' est déjà dans un autre four : rien n’a été remis.';
    s.fours[h.four]={id:h.cid||h.id,num:h.num,source:h.source,machine:h.machine,debut:h.debut,duree:h.duree,fin:h.fin,par:h.par};
    s.histo.splice(i,1);fvu(s,a);return '';
  }

    var d=dureeFour(s,four);

// --- Les fours = machines du PARC (socle § 2) : secteur frittage, type « Four » (« Four … » aussi), ordre du parc, rangés

  var rang=function(x){var i=gr.indexOf(x.partie);return i<0?(x.partie?gr.length:gr.length+1):i};

// État d'un four à l'instant now : libre | cours | sortir (temps fini) | hs ; reste / depasse en ms.
function etatFour(s,f,now){

// Plateaux proposés à l'entrée : fins de production des Lancements des 12 dernières heures (n° connu), pas encore au four
// ni déjà passés au four depuis (même n°). Le plus récent d'abord ; un n° une seule fois.
function propositions(lanc,s,now){

  for(k in (s&&s.fours)||{})pris[s.fours[k].num]=1;

  h.slice().sort(function(a,b){return (b.fin||0)-(a.fin||0)}).forEach(function(x){
    var n=normNum(x&&x.num),fin=fms(x&&x.fin);if(!n||!fin||now-fin>12*3600000||fin>now+600000)return;

var EcranFours=(function(){

// --- Garder sa place pendant un nouveau dessin (défaut du 22/10 : « la page remonte » quand on remplit une case) ---------
// Un nouveau dessin de la page garde : le défilement de la page, celui des zones qui défilent seules (panneau de droite du
// flux, dessin, tableaux larges) et le focus du champ où la personne est ALLÉE (Tab, toucher un autre champ) : au moment
// où le champ quitté prévient de son changement, le suivant n'a pas encore le focus, d'où le suivi par « focusin ».
let placeFocus=null,placeDessin=false;
function clePlace(a){
  if(!a||a===document.body||!a.closest||!a.closest('#page'))return null;
  if(a.id)return '#'+CSS.escape(a.id);
  const d=a.dataset||{},ks=Object.keys(d).filter(k=>k!=='bulle');if(!ks.length)return null;
  return a.tagName.toLowerCase()+ks.map(k=>'[data-'+k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())+'="'+CSS.escape(d[k])+'"]').join('');
}
document.addEventListener('focusin',e=>{const k=clePlace(e.target);if(k)placeFocus=k});
// Sortie vers « rien » (toucher un blanc) : plus de focus à rendre. Un champ retiré par le dessin ne compte pas (le
// navigateur prévient aussi quand il retire le champ qui a le focus).
document.addEventListener('focusout',e=>{if(!e.relatedTarget&&!placeDessin&&e.target.isConnected)placeFocus=null});
// Changement d'écran : la hauteur gardée par le dessin précédent ne sert plus.
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-go]');const pg=document.getElementById('page');if(b&&pg)pg.style.minHeight=''},true);
addEventListener('hashchange',()=>{const pg=document.getElementById('page');if(pg)pg.style.minHeight=''});
// Le dessin attend un tour : sinon il se fait avant que le navigateur ait donné le focus au champ suivant (Tab, toucher

  if(!r||!/^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(String(r.data||'')))throw new Error('Pas de capture reçue.');
  const data=await imageVersPhoto(r.data),id='p'+alea(24),j=await appel('photo-ecrire',{id,data});
  if(j.status!==200)throw new Error((j.data&&j.data.error)||'Photo refusée.');
  if(/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(data))S.photos[id]=data;
  return envoyerLancements([{type:'modifier',machine,fid,photo:id}],'Capture jointe au fichier.');
}

// Un texte (ou un nom de champ) ressemble-t-il à un nom de fichier ? (tout l'objet, comme le script)
const rdSuspect=(o,p)=>{p=p||0;if(p>6)return true;if(typeof o==='string')return RD_NOM_FICHIER.test(o);if(Array.isArray(o))return o.some(x=>rdSuspect(x,p+1));
  if(o&&typeof o==='object')return Object.keys(o).some(k=>RD_NOM_FICHIER.test(k)||/cas/i.test(k)||rdSuspect(o[k],p+1));return false};
// Contrôle du fichier choisi (le script refait tous les contrôles).
function rdLireImport(texte,st,parc){
  const er=[];let o=null;
  try{o=JSON.parse(texte)}catch(x){return {erreurs:['Fichier illisible (ce n’est pas le fichier d’import).']}}
  if(!o||o.format!=='rd-import-excel'||o.secteur!=='frittage'||!Array.isArray(o.essais)||!o.essais.length)return {erreurs:['Ce n’est pas le fichier d’import des essais de l’Excel du frittage.']};
  const vus={};
  o.essais.forEach((e,i)=>{
    if(!e||typeof e!=='object'){er.push('Essai '+(i+1)+' illisible.');return}
    const autres=Object.keys(e).filter(k=>!RD_IMPORT_CHAMPS.includes(k));if(autres.length)er.push('Essai '+(e.num||i+1)+' : champ non permis « '+autres[0]+' ».');
    if(!(Number.isInteger(e.num)&&e.num>0)||vus[e.num])er.push('Essai '+(i+1)+' : numéro invalide ou en double.');vus[e.num]=1;
    if(!String(e.titre||'').trim())er.push('Essai '+e.num+' : sans nom.');
    if(!RD_AV.some(a=>a[0]===e.avancement))er.push('Essai '+e.num+' : avancement inconnu.');
    if(rdSuspect(e))er.push('Essai '+e.num+' : un texte ressemble à un nom de fichier.');
  });
  const deja=(st.essais||[]).filter(e=>vus[e.num]||e.origine==='excel');
  if(deja.length)er.push('Des essais du frittage portent déjà ces numéros, ou l’Excel a déjà été repris (n° '+deja.slice(0,5).map(e=>e.num).join(', ')+') : import refusé.');
  // Correspondance proposée : même nom (sans tenir compte des majuscules) ou ancien nom d'une machine du parc.
  const carte={},cmp=x=>String(x).trim().toLowerCase();
  o.essais.forEach(e=>(e.machines||[]).forEach(n=>{if(carte[n]!==undefined)return;const m=parc.find(p=>cmp(p.nom)===cmp(n)||(p.anciens||[]).some(a=>cmp(a)===cmp(n)));carte[n]=m?m.nom:''}));
  return {essais:o.essais,erreurs:er,carte};
}

// --- Enregistrements (temps masqué, comme les autres parties) --------------------------------------------------
// Création : sans version ; modification : fusion champ par champ à partir de l'essai tel qu'il a été ouvert (updated).
function enregistrerRd(sec,item,origine,libelle,reprise){
  const cle=rdCle(sec),id=item.id,esp='rd|'+sec+'|'+id;
  const trouve=d=>((d.state||{}).essais||[]).find(x=>x.id===id);
  const version=d=>{const o=trouve(d);return o?(o.updated||0):undefined};
  const nouvelle=j=>{const o=(((j.data||{}).state||{}).essais||[]).find(x=>x.id===id);return o?(o.updated||0):undefined};
  const apres=(j,base)=>Object.assign({},base,{rev:j.data.rev,state:j.data.state,vierge:null});
  if(origine){
    const f={lire:d=>rdChamps(trouve(d)),
      ecrire:(d,p)=>{const st=d.state=d.state||{types:[],essais:[]},l=st.essais=st.essais||[],i=l.findIndex(x=>x.id===id);const o=Object.assign({},i>=0?l[i]:{},p,{id,_attente:true});if(i<0)l.push(o);else l[i]=o;return d},
      corps:(p,d)=>({secteur:sec,essai:Object.assign({},p,{id}),base:{updated:version(d)||0}})};
    enregistrer(tacheFusion({cle,op:'rd-ecrire',page:'c-rd',libelle,esp,vu:origine.updated||0,version,nouvelle,apres,reprise},f,()=>rdChamps(item),rdChamps(origine)));
    return;
  }
  enregistrer({cle,op:'rd-ecrire',page:'c-rd',libelle,esp,
    construire:()=>({secteur:sec,essai:Object.assign(rdChamps(item),{id})}),
    vue:d=>{const st=d.state=d.state||clone(d.vierge||{types:[],essais:[]}),l=st.essais=st.essais||[];
      if(!l.some(x=>x.id===id))l.push(Object.assign(rdChamps(item),{id,num:0,avancement:'planifier',origine:'',creePar:S.moi&&S.moi.nom||'',creeLe:Date.now(),notes:{},_attente:true}));return d},
    nouvelle,apres,reprise,
    // Réponse de Google : le numéro donné à l'essai.
    refus:j=>{if(S.rd&&j&&j.data&&j.data.num)S.rd.msg=['ok','Essai n° '+j.data.num+' enregistré : « '+esc(item.titre)+' ».']}});
}

}
async function rdEssai(id){const sec=R().sec,r=await lire('rd-lire',{secteur:sec});const st=r.ok?(r.data.state||{essais:[]}):{essais:[]};return {sec,r,e:(st.essais||[]).find(x=>x.id===id)}}

async function actionRd(b){
  const R0=R(),act=b.dataset.rd,sec=R0.sec;
  const page=()=>chargerPage(),haut=()=>{chargerPage().then(()=>scrollTo(0,0))};
  if(act==='filtre-av'){R0.f.av=R0.f.av===b.dataset.v?'':b.dataset.v;return page()}
  if(act==='orig'){R0.f.orig=b.dataset.v;return page()}
  if(act==='raz'){R0.f={av:'',type:'',q:'',orig:''};return page()}
  if(act==='ouvrir'){R0.vue='fiche';R0.id=b.dataset.id;R0.c=null;R0.msg=null;return haut()}
  if(act==='liste'){if(R0.c&&R0.c.sale){R0.msg=['warn','Enregistrez ou annulez d’abord les résultats en cours.'];return page()}R0.vue='liste';R0.c=null;R0.msg=null;return haut()}
  if(act==='nouveau'){
    R0.orig=null;R0.sale=false;R0.msg=null;R0.vue='form';
    R0.b={id:'e'+alea(16),titre:'',type:'',machines:[],date:new Date().toISOString().slice(0,10),nest:'',contacts:'',parametres:[{nom:'',avant:'',apres:''}],objectif:'',conditions:'',controle:'',consignes:''};
    return haut();
  }
  if(act==='modifier'){const {e}=await rdEssai(R0.id);if(!e||e._attente)return page();R0.orig=clone(e);R0.b=Object.assign(rdChamps(e),{id:e.id});if(!(R0.b.parametres||[]).length)R0.b.parametres=[{nom:'',avant:'',apres:''}];R0.sale=false;R0.msg=null;R0.vue='form';return haut()}
  if(act==='annuler'){R0.vue=R0.orig?'fiche':'liste';R0.b=null;R0.orig=null;R0.sale=false;R0.msg=null;return haut()}
  if(act==='machine'&&R0.b){const m=b.dataset.m,l=R0.b.machines=R0.b.machines||[];R0.b.machines=l.includes(m)?l.filter(x=>x!==m):l.concat(m);R0.sale=true;return page()}
  if(act==='param-plus'&&R0.b){R0.b.parametres=(R0.b.parametres||[]).concat({nom:'',avant:'',apres:''}).slice(0,30);R0.sale=true;return page()}
  if(act==='param-moins'&&R0.b){R0.b.parametres.splice(+b.dataset.i,1);R0.sale=true;return page()}
  if(act==='enregistrer'&&R0.b){
    const x=clone(R0.b),neuf=!R0.orig,r=await lire('rd-lire',{secteur:sec}),st=r.ok?(r.data.state||r.data.vierge||{types:[]}):{types:[]};
    x.titre=String(x.titre||'').trim();x.parametres=(x.parametres||[]).filter(p=>p.nom||p.avant||p.apres);
    const manque=!x.titre?'Donnez un nom à l’essai.':neuf&&(st.types||[]).length&&!x.type?'Choisissez le type d’essai.':neuf&&!String(x.objectif||'').trim()?'Écrivez l’objectif de l’essai.':'';
    // Relecture du 20/10 : aucun texte qui ressemble à un nom de fichier de cas (le script refait le contrôle).
    const manque2=manque||(rdSuspect(rdChamps(x))?'Pas de nom de fichier ni de nom de patient : un texte ressemble à un nom de fichier de cas (.stl, .dcm, chemin…). Retirez-le.':'');
    if(manque2){R0.msg=['err','<b>'+manque2+'</b>'];return haut()}
    const sauve={b:clone(R0.b),orig:clone(R0.orig),sec};
    enregistrerRd(sec,x,R0.orig,(neuf?'nouvel essai':'essai '+rdNum(R0.orig))+' « '+x.titre.slice(0,40)+' »',()=>{const r2=R();Object.assign(r2,{sec:sauve.sec,vue:'form',b:sauve.b,orig:sauve.orig,sale:true})});
    R0.vue='fiche';R0.id=x.id;R0.b=null;R0.orig=null;R0.sale=false;R0.c=null;R0.msg=neuf?['info','Essai envoyé à Google : son numéro arrive dans un instant.']:null;

  }
  // Fiche : avancement à la main, résultats, conclusion, photos.
  if(act==='avancement'||act==='resultats'||act==='conclure'||act==='photo-retirer'){
    const {e}=await rdEssai(R0.id);if(!e||e._attente)return page();

      reg.addEventListener('updatefound',()=>suivre(reg.installing));
      // Nouvelle publication cherchée au retour sur la fenêtre et toutes les 30 minutes.
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});

<script>
'use strict';
// ===============================================================================================================
// Flux de l'atelier (lot 1, 2026-10-22) — maquette validée par l'utilisateur, conception de la base de données et
// réponses de l'utilisateur du 22/10. Écrans : Dessiner le flux (f-dessin), Temps et capacités (f-temps), Validation
// et versions (f-valid, administrateur), Réglages et droits du flux (f-droits, administrateur).
// Le script Google contrôle tout (droits par écran ET par secteur, versions, publication) : cette page n'est qu'une aide.
// Rien n'est gardé dans le navigateur, sauf en MODE ESSAI LOCAL (script Google pas encore à jour) : le brouillon est
// alors gardé sur ce PC (localStorage « flux-essai-local »), rien n'est envoyé à Google ni aux tablettes, et c'est
// dit en orange en haut de chaque écran.
// ===============================================================================================================
const FluxFusion=(function(){
// <flux-fusion> copie exacte du bloc <fusion> de Flux\Sources\flux-fusion.js (tests\google.ts vérifie qu'ils sont identiques)
var FLUX_FORMAT = 'flux-atelier', FLUX_VERSION_FORMAT = 1;
// Types de case : ceux de l'éditeur + Éclatement, Regroupement, Transport (propositions retenues le 22/10/2026).
// L'ancien éditeur ramène un type inconnu à « Poste manuel » à l'ouverture d'un export.
var FLUX_TYPES = {debut: 'Début', fichier: 'Traitement des fichiers', machine: 'Machine', manuel: 'Poste manuel', controle: 'Contrôle',
  attente: 'Stock / attente', eclatement: 'Éclatement', regroupement: 'Regroupement', transport: 'Transport', fin: 'Fin / expédition'};
var FLUX_SANS_TEMPS = ['debut', 'fin'];
var FLUX_UNITES = ['plateau', 'piece', 'lot'];
var FLUX_SOURCES = {manuel: 'Saisie manuelle', qr: 'Scan QR code', base: 'Base de données', lancements: 'Appli Lancements du pack', autre: 'Autre'};
var FLUX_EVENEMENTS = ['arrivee', 'debut', 'fin', 'passage', 'rebut', 'reprise'];
var FLUX_ETATS = ['brouillon', 'a-valider', 'refuse'];
// Garde-fous (conception du 22/10) : un périmètre reste petit (≈ 30 à 50 Ko), Google et la console ne saturent jamais.
var FLUX_LIMITES = {etapes: 300, liens: 600, familles: 50, groupes: 60, secteurs: 30, machines: 20, tranches: 8, points: 10};
// Réglages du calcul par défaut : les mêmes que le modèle (flux-modele.js). Les heures des équipes sont des réglages.
var FLUX_REGLAGES_DEFAUT = {rendement: 0.85, seuilCharge: 80, seuilSature: 100, horizonMin: 60, tranches: [
  {id: 'matin', nom: 'Matin', de: '06:00', a: '13:00', enPlus: false}, {id: 'journee', nom: 'Journée', de: '08:00', a: '16:00', enPlus: true},
  {id: 'aprem', nom: 'Après-midi', de: '13:00', a: '20:00', enPlus: false}, {id: 'nuit', nom: 'Nuit', de: '20:00', a: '06:00', enPlus: false}]};

function fluxObjet(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
function fluxCopie(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function fluxTexte(v, n) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, n); }
// Texte sur plusieurs lignes (notes) : lignes gardées, longueur limitée.
function fluxNotes(v, n) { return String(v == null ? '' : v).replace(/\r\n?/g, '\n').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim().slice(0, n); }
// Nombre dans [min, max], arrondi au centième ; vide, texte ou hors bornes = null (« à saisir »).
function fluxNombre(v, min, max) {
  if (v === null || v === undefined || v === '' || typeof v === 'boolean') return null;
  var n = typeof v === 'number' ? v : Number(String(v).replace(',', '.'));
  if (!isFinite(n) || n < min || n > max) return null;
  return Math.round(n * 100) / 100;
}
function fluxIdOk(v) { return typeof v === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(v); }
function fluxId(v) { return fluxIdOk(v) ? v : ''; }
function fluxSecteurOk(v) { return typeof v === 'string' && /^[a-z0-9-]{1,30}$/.test(v); }
function fluxCouleur(v, d) { return typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v) ? v : d; }
function fluxHeure(v, d) { var m = /^(\d{1,2}):(\d{2})$/.exec(String(v || '')); return m && +m[1] < 24 && +m[2] < 60 ? ('0' + (+m[1])).slice(-2) + ':' + m[2] : d; }
function fluxListeIds(l, max) { var r = []; (Array.isArray(l) ? l : []).forEach(function (x) { if (fluxIdOk(x) && r.indexOf(x) < 0 && r.length < max) r.push(x); }); return r; }

// N° « Agir sur » du rapport Oqcam (décision du 22/10) : identifiant du plateau pour les lots suivants. Accepté avec ou
// sans « .wza », espaces et casse ignorés ; une autre forme reste acceptée mais signalée (conforme:false).
function normaliserAgirSur(t) {
  var s = String(t == null ? '' : t).replace(/\s+/g, '').toUpperCase().replace(/\.WZA$/, '');
  return {valeur: s.slice(0, 40), conforme: /^[A-Z]-\d{3}-\d{3,6}$/.test(s)};
}

// ---------- Éléments du flux ----------
function normaliserEtape(e) {
  if (!fluxObjet(e) || !fluxIdOk(e.id)) return null;
  var t = fluxObjet(e.temps) ? e.temps : {}, c = fluxObjet(e.capacite) ? e.capacite : {}, s = fluxObjet(e.source) ? e.source : {};
  var pf = {}, pt = {};
  if (fluxObjet(t.parFamille)) Object.keys(t.parFamille).slice(0, FLUX_LIMITES.familles).forEach(function (k) { var v = fluxNombre(t.parFamille[k], 0, 100000); if (fluxIdOk(k) && v !== null) pf[k] = v; });
  if (fluxObjet(c.parTranche)) Object.keys(c.parTranche).slice(0, FLUX_LIMITES.tranches).forEach(function (k) { var v = fluxNombre(c.parTranche[k], 0, 1000); if (/^[a-z0-9-]{1,20}$/.test(k) && v !== null) pt[k] = v; });
  var machines = fluxListeIds(e.machines, FLUX_LIMITES.machines);
  // Ancien fichier : « machine » est un nom libre ; il reste « à rattacher » au parc tant qu'aucune machine n'est choisie.
  var texte = e.machineTexte != null && e.machineTexte !== '' ? e.machineTexte : machines.length ? '' : e.machine;
  var pts = [];
  (Array.isArray(e.points) ? e.points : []).slice(0, FLUX_LIMITES.points).forEach(function (p) {
    if (fluxObjet(p)) pts.push({evenement: FLUX_EVENEMENTS.indexOf(p.evenement) >= 0 ? p.evenement : 'passage', cle: fluxTexte(p.cle, 80)});
  });
  var anc = [];
  (Array.isArray(e.anciens) ? e.anciens : []).forEach(function (a) { a = fluxTexte(a, 80); if (a && anc.indexOf(a) < 0 && anc.length < 10) anc.push(a); });
  var pos = function (v) { var n = Number(v); return isFinite(n) ? Math.max(-100000, Math.min(100000, Math.round(n))) : 0; };
  // Machine (22/10/2026) : temps.defaut / parFamille = TEMPS MACHINE (le cycle où la machine est occupée, ancien « temps »,
  // repris sans perte) ; temps.prep / temps.fin = temps OPÉRATEUR facultatifs avant le lancement et après (déchargement) ;
  // capacite.suite = productions à la suite sans opérateur (vide = 1 : préparation et déchargement à chaque production).
  var suite = fluxNombre(c.suite, 1, 1000);
  return {id: e.id, nom: fluxTexte(e.nom, 80) || 'Nouvelle étape', type: FLUX_TYPES[e.type] ? e.type : 'manuel',
    secteur: fluxSecteurOk(e.secteur) ? e.secteur : '', x: pos(e.x), y: pos(e.y), unite: FLUX_UNITES.indexOf(e.unite) >= 0 ? e.unite : 'plateau',
    temps: {defaut: fluxNombre(t.defaut, 0, 100000), parFamille: pf, prep: fluxNombre(t.prep, 0, 100000), fin: fluxNombre(t.fin, 0, 100000)},
    capacite: {personnes: fluxNombre(c.personnes, 0, 1000), machines: fluxNombre(c.machines, 0, 1000), parCycle: fluxNombre(c.parCycle, 1, 1000), parTranche: pt,
      suite: suite === null ? null : Math.round(suite)},
    machines: machines, machineTexte: fluxTexte(texte, 120),
    source: {type: FLUX_SOURCES[s.type] ? s.type : 'manuel', detail: fluxTexte(s.detail, 200)},
    notes: fluxNotes(e.notes, 500), points: pts, groupe: fluxId(e.groupe), anciens: anc};
}
function normaliserLien(l) {
  if (!fluxObjet(l) || !fluxIdOk(l.id) || !fluxIdOk(l.de) || !fluxIdOk(l.vers)) return null;
  return {id: l.id, de: l.de, vers: l.vers, familles: fluxListeIds(l.familles, FLUX_LIMITES.familles), reprise: l.reprise === true,
    notes: fluxNotes(l.notes, 300), part: fluxNombre(l.part, 0, 100), transfert: fluxNombre(l.transfert, 0, 10000)};
}
function normaliserFamille(f) {
  if (!fluxObjet(f) || !fluxIdOk(f.id)) return null;
  var def = {};
  if (fluxObjet(f.definition)) Object.keys(f.definition).slice(0, 10).forEach(function (k) { if (/^[a-z][A-Za-z0-9_]{0,30}$/.test(k)) def[k] = fluxTexte(f.definition[k], 60); });
  return {id: f.id, nom: fluxTexte(f.nom, 60) || 'Famille', couleur: fluxCouleur(f.couleur, '#0B8A96'), description: fluxNotes(f.description, 300),
    parent: fluxId(f.parent) === f.id ? '' : fluxId(f.parent), part: fluxNombre(f.part, 0, 100), definition: def};
}
function normaliserGroupe(g) {
  if (!fluxObjet(g) || !fluxIdOk(g.id)) return null;
  return {id: g.id, nom: fluxTexte(g.nom, 60) || 'Groupe', secteur: fluxSecteurOk(g.secteur) ? g.secteur : '', couleur: fluxCouleur(g.couleur, '#7349C2')};
}
function normaliserReglages(r) {
  r = fluxObjet(r) ? r : {};
  var D = FLUX_REGLAGES_DEFAUT, v = function (x, min, max, d) { var n = fluxNombre(x, min, max); return n === null ? d : n; };
  var tr = [];
  (Array.isArray(r.tranches) ? r.tranches : D.tranches).forEach(function (t) {
    if (!fluxObjet(t) || !/^[a-z0-9-]{1,20}$/.test(String(t.id || '')) || tr.length >= FLUX_LIMITES.tranches || tr.some(function (x) { return x.id === t.id; })) return;
    tr.push({id: t.id, nom: fluxTexte(t.nom, 30) || t.id, de: fluxHeure(t.de, '00:00'), a: fluxHeure(t.a, '00:00'), enPlus: t.enPlus === true});
  });
  return {rendement: v(r.rendement, 0.1, 1, D.rendement), seuilCharge: v(r.seuilCharge, 1, 500, D.seuilCharge), seuilSature: v(r.seuilSature, 1, 500, D.seuilSature),
    horizonMin: v(r.horizonMin, 5, 1440, D.horizonMin), tranches: tr};
}
// Liste d'éléments : normalisés, identifiants en double retirés (le premier gagne), limite respectée.
function fluxListe(l, f, max) {
  var r = [], vus = {};
  (Array.isArray(l) ? l : []).forEach(function (x) { var n = f(x); if (n && !vus[n.id] && r.length < max) { vus[n.id] = 1; r.push(n); } });
  return r;
}

// ---------- Le flux entier (fichier, version publiée) ----------
// Flèches vers une case absente et flèche d'une case vers elle-même : retirées (comme l'éditeur à l'ouverture).
function normaliserFlux(brut) {
  var b = fluxObjet(brut) ? brut : {};
  var secteurs = [];
  (Array.isArray(b.secteurs) ? b.secteurs : []).forEach(function (s) {
    if (fluxObjet(s) && fluxSecteurOk(s.id) && !secteurs.some(function (x) { return x.id === s.id; }) && secteurs.length < FLUX_LIMITES.secteurs)
      secteurs.push({id: s.id, nom: fluxTexte(s.nom, 40) || s.id, couleur: fluxCouleur(s.couleur, '#0B8A96')});
  });
  var etapes = fluxListe(b.etapes, normaliserEtape, FLUX_LIMITES.etapes), ids = {};
  etapes.forEach(function (e) { ids[e.id] = 1; });
  var liens = fluxListe(b.liens, normaliserLien, FLUX_LIMITES.liens).filter(function (l) { return ids[l.de] && ids[l.vers] && l.de !== l.vers; });
  var groupes = fluxListe(b.groupes, normaliserGroupe, FLUX_LIMITES.groupes), gids = {};
  groupes.forEach(function (g) { gids[g.id] = 1; });

async function charger(ecran,force){
  if(F.d&&!force&&F.ecran===ecran&&(F.mode==='local'||F.d.perimetre===F.perim))return;
  if(F.ecran&&F.ecran!==ecran&&!fluxSale()){F.d=null}
  F.ecran=ecran;
  if(F.mode==='local')return chargerLocal();
  let j;
  try{j=await appel('flux-lire',{ecran:ecran,perim:F.perim})}
  catch(e){if(e.message==='session')throw e;F.err={status:0,error:e.message};return}
  // Ancien script Google (pas encore mis à jour par l'utilisateur) : « Opération refusée » → mode essai sur ce PC.
  if(j.status===400&&/^Opération refusée/i.test(String(j.data&&j.data.error||''))){F.mode='local';return chargerLocal()}
  if(j.status!==200){F.err={status:j.status,error:(j.data&&j.data.error)||'Lecture impossible.'};F.d=null;return}
  recevoir(j.data);
}
function recevoir(d){F.d=d;F.mode='google';F.perim=d.perimetre;F.err=null;rebatir()}

// Copie de travail : chaque secteur = son brouillon (s'il existe) sinon sa part publiée ; un secteur modifié et pas encore
// enregistré est gardé tel quel (jamais écrasé par une relecture).
function rebatir(){
  const d=F.d,secs=secteursPerim(),T=F.trav&&F.trav.perim===d.perimetre?F.trav:{perim:d.perimetre,secteurs:{},commun:null};
  const pub=d.publie?d.publie.flux:FF.fluxVide();
  const parts={};
  secs.forEach(s=>{parts[s]=1});Object.keys((d.brouillon||{}).secteurs||{}).forEach(s=>{parts[s]=1});
  const neuf={perim:d.perimetre,secteurs:{},commun:null};
  Object.keys(parts).forEach(s=>{
    if(F.sale[s]&&T.secteurs[s]){neuf.secteurs[s]=T.secteurs[s];return}
    const b=(d.brouillon&&d.brouillon.secteurs||{})[s];
    neuf.secteurs[s]=b?{etapes:clone(b.etapes||[]),liens:clone(b.liens||[]),groupes:clone(b.groupes||[])}:clone(FF.partSecteur(pub,s));
  });
  if(F.communSale&&T.commun)neuf.commun=T.commun;
  else{const c=d.brouillon&&d.brouillon.commun;neuf.commun=c?{familles:clone(c.familles),reglages:clone(c.reglages),nom:c.nom}:{familles:clone(pub.familles),reglages:clone(pub.reglages),nom:pub.nom}}
  F.trav=neuf;
  if(F.sel&&!trouver(F.sel.id)&&!trouverLien(F.sel.id))F.sel=null;
}

// --- Flux affichés : futur (brouillon) et actuel (publié) ------------------------------------------------------------
function futur(){
  let f=F.d&&F.d.publie?clone(F.d.publie.flux):FF.fluxVide();
  Object.keys(F.trav.secteurs).forEach(s=>{f=FF.remplacerSecteur(f,s,F.trav.secteurs[s])});
  const c=F.trav.commun;if(c){f.familles=c.familles;f.reglages=c.reglages;f.nom=c.nom}
  return f;
}
const actuel=()=>F.d&&F.d.publie?clone(F.d.publie.flux):FF.fluxVide();
const fluxAffiche=()=>F.version==='actuel'?actuel():futur();
function trouver(id,f){f=f||(F.trav?{etapes:Object.values(F.trav.secteurs).flatMap(p=>p.etapes)}:{etapes:[]});return (f.etapes||[]).find(e=>e.id===id)||null}
function trouverLien(id){if(!F.trav)return null;for(const s of Object.keys(F.trav.secteurs)){const l=F.trav.secteurs[s].liens.find(x=>x.id===id);if(l)return {l,s}}return null}
const partDe=s=>F.trav.secteurs[s]||(F.trav.secteurs[s]={etapes:[],liens:[],groupes:[]});
const famillesNom=id=>{const f=(F.trav&&F.trav.commun&&F.trav.commun.familles||[]).find(x=>x.id===id);return f?f.nom:id};
function machinesDe(s){return (F.d&&F.d.machinesParc&&F.d.machinesParc[s])||[]}
function nomMachine(id,s){const m=machinesDe(s).find(x=>x.id===id)||Object.values((F.d&&F.d.machinesParc)||{}).flat().find(x=>x.id===id);return m?m.nom:'(machine retirée du parc)'}

// --- Modifications (copie de travail, annuler / refaire) -------------------------------------------------------------
function instantane(){return JSON.stringify({secteurs:F.trav.secteurs,commun:F.trav.commun,sale:F.sale,communSale:F.communSale})}
function retablir(x){const o=JSON.parse(x);F.trav.secteurs=o.secteurs;F.trav.commun=o.commun;F.sale=o.sale;F.communSale=o.communSale}
function modifier(sec,fn,temps){
  if(sec==='commun'?!peutCommun():!(temps?peutTemps(sec):peutDessin(sec))){F.msg=['warn','Vous ne pouvez pas modifier '+(sec==='commun'?'les familles et réglages':'le secteur '+esc(nomSec(sec)))+'.'];return false}
  F.pile.push(instantane());if(F.pile.length>40)F.pile.shift();F.refaire=[];
  // Mode essai : gardé tout de suite sur ce PC (rien à « enregistrer ») ; sinon le secteur est marqué « à enregistrer ».
  if(sec==='commun'){fn(F.trav.commun);if(F.mode!=='local')F.communSale=true}else{fn(partDe(sec));if(F.mode!=='local')F.sale[sec]=true}
  F.msg=null;F.conflit=F.conflit&&F.conflit.sec!==sec?F.conflit:null;
  if(F.mode==='local')ecrireLocal();
  return true;
}
function annuler(){if(!F.pile.length)return;F.refaire.push(instantane());retablir(F.pile.pop());if(F.mode==='local')ecrireLocal()}
function refaire(){if(!F.refaire.length)return;F.pile.push(instantane());retablir(F.refaire.pop());if(F.mode==='local')ecrireLocal()}
const nouvelId=p=>p+alea(10);
// Secteur où ajouter : celui choisi en haut s'il est modifiable, sinon le premier modifiable.
function secteurCible(){const l=secteursPerim().filter(peutDessin);return F.filtre&&l.includes(F.filtre)?F.filtre:l[0]||''}
function ajouterCase(type){
  const sec=secteurCible();if(!sec){F.msg=['warn','Aucun secteur que vous pouvez modifier dans ce flux.'];return}
  const f=futur(),des=f.etapes.filter(e=>e.secteur===sec),idx=secteursPerim().indexOf(sec);
  const y=des.length?Math.round(des.reduce((a,e)=>a+e.y,0)/des.length/10)*10:40+Math.max(0,idx)*200;
  const x=des.length?Math.max(...des.map(e=>e.x))+CW+60:40;
  const e=FF.normaliserEtape({id:nouvelId('e'),nom:nomType(type),type,secteur:sec,x,y});
  if(modifier(sec,p=>{p.etapes.push(e)})){F.sel={type:'etape',id:e.id};F.selection=[];if(x>0)F.defiler=e.id}
}
function supprimerEtapes(ids){
  const parSec={};ids.forEach(id=>{const e=trouver(id);if(e&&peutDessin(e.secteur))(parSec[e.secteur]=parSec[e.secteur]||[]).push(id)});
  let entrants=0,faits=0;const f=futur(),avant=instantane();
  Object.keys(parSec).forEach(s=>{const l=parSec[s];
    entrants+=f.liens.filter(x=>l.includes(x.vers)&&!l.includes(x.de)&&(trouver(x.de,f)||{}).secteur!==s).length;
    if(modifier(s,p=>{p.etapes=p.etapes.filter(e=>!l.includes(e.id));p.liens=p.liens.filter(x=>!l.includes(x.de)&&!l.includes(x.vers));
      const reste=new Set(p.etapes.map(e=>e.groupe).filter(Boolean));p.groupes=p.groupes.filter(g=>reste.has(g.id))}))faits++});

  else if(ids.length)F.msg=['warn','<b>Rien n’est retiré :</b> ces cases sont d’un secteur que vous ne pouvez pas modifier.'];
  if(entrants)F.msg=['warn','<b>'+entrants+' flèche(s) d’un autre secteur arrivent sur la case retirée.</b> Ce secteur devra les retirer : sinon la publication sera refusée.'];
}
function copierSelection(){

function coller(){

const brouillonDuSecteur=s=>F.d&&F.d.brouillon&&F.d.brouillon.secteurs?F.d.brouillon.secteurs[s]||null:null;

async function enregistrer(){
  if(F.envoi)return;
  if(F.mode==='local'){if(ecrireLocal()){F.sale={};F.communSale=false;F.msg=['ok','Gardé sur ce PC (mode essai). Rien n’est envoyé à Google.']}return}
  F.envoi=true;const faits=[];
  try{
    for(const s of Object.keys(F.sale).filter(x=>F.sale[x])){
      const b=brouillonDuSecteur(s),j=await appel('flux-brouillon-ecrire',{ecran:ecranPour(s),perim:F.d.perimetre,sec:s,part:partEnvoi(F.trav.secteurs[s]),depuis:b?b.maj:0,rev:F.d.publie?F.d.publie.rev:0});
      if(j.status===200){F.sale[s]=false;recevoir(j.data);faits.push(nomSec(s));continue}
      if(j.status===409&&j.data&&j.data.lu){F.conflit={sec:s,msg:j.data.error};recevoir(j.data.lu);F.msg=null;return}
      F.msg=['err','<b>'+esc((j.data&&j.data.error)||'Enregistrement refusé.')+'</b>'];return;
    }
    if(F.communSale){
      const c=brouillonCommun(),j=await appel('flux-commun-ecrire',{ecran:ecranPour('commun'),perim:F.d.perimetre,commun:F.trav.commun,depuis:c?c.maj:0,rev:F.d.publie?F.d.publie.rev:0});
      if(j.status===200){F.communSale=false;recevoir(j.data);faits.push('familles et réglages')}
      else if(j.status===409&&j.data&&j.data.lu){F.conflit={sec:'commun',msg:j.data.error};recevoir(j.data.lu);return}
      else{F.msg=['err','<b>'+esc((j.data&&j.data.error)||'Enregistrement refusé.')+'</b>'];return}
    }
    F.conflit=null;F.pile=[];F.refaire=[];
    if(faits.length)F.msg=['ok','Brouillon enregistré ('+esc(faits.join(', '))+'). Il ne part sur les tablettes qu’après validation par l’administrateur.'];
  }finally{F.envoi=false}
}
async function action(op,extra,ok){
  if(F.mode==='local'){F.msg=['warn','Impossible en mode essai : le script Google doit d’abord être mis à jour.'];return null}
  const j=await appel(op,Object.assign({perim:F.d.perimetre},extra));
  if(j.status===200){if(j.data&&j.data.perimetres)recevoir(j.data);F.msg=['ok',ok];return j}
  if(j.status===409&&j.data&&j.data.lu){recevoir(j.data.lu)}
  F.msg=['err','<b>'+esc((j.data&&j.data.error)||'Refusé.')+'</b>'+(j.data&&j.data.erreurs&&j.data.erreurs.length>1?'<ul class="fx-ctl">'+j.data.erreurs.slice(1,8).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')];

// Relecture du 22/10 (A) : après un 409, la personne voit ce qui a changé chez Google par rapport à SA version avant de

function boiteConflit(){

  else{const b=brouillonDuSecteur(s),g=b?{etapes:b.etapes,liens:b.liens,groupes:b.groupes}:FF.partSecteur(pub,s);qui=b?b.majPar:'';
    a=Object.assign(FF.fluxVide(),{etapes:g.etapes,liens:g.liens,groupes:g.groupes,familles:pub.familles,reglages:pub.reglages,nom:pub.nom});
    m=Object.assign(FF.fluxVide(),{etapes:F.trav.secteurs[s].etapes,liens:F.trav.secteurs[s].liens,groupes:F.trav.secteurs[s].groupes,familles:pub.familles,reglages:pub.reglages,nom:pub.nom})}

function listeDiffCourte(a,f,diff){
  const nom=(id,x)=>{const e=x.etapes.find(y=>y.id===id);return e?e.nom:id};

function geometrie(f){

function cheminLien(a,b,g){

function toile(){

    const lib=e.nom+', '+nomType(e.type)+(e.masque?'':', secteur '+nomSec(e.secteur))+(ro?' (lecture seule)':'');
    h+='<div class="'+cls.join(' ')+'" data-fxe="'+esc(e.id)+'" role="button" tabindex="0" aria-label="'+esc(lib)+'" style="left:'+(e.x+g.ox)+'px;top:'+(e.y+g.oy)+'px;--c:'+couleurSec(e.secteur)+'">'+

  });

function listeDifferences(a,f,diff){
  const nom=(id,x)=>{const e=(x||f).etapes.find(y=>y.id===id);return e?e.nom:id};
  const lien=(id,x)=>{const l=(x||f).liens.find(y=>y.id===id);return l?nom(l.de,x)+' → '+nom(l.vers,x):id};
  const li=[];
  diff.etapes.ajoutes.forEach(id=>li.push('<li><span class="fx-ok">+</span> Case ajoutée : '+esc(nom(id))+'</li>'));
  diff.etapes.retires.forEach(id=>li.push('<li><span class="fx-ko">✕</span> Case retirée : '+esc(nom(id,a))+'</li>'));
  diff.etapes.modifies.forEach(m=>li.push('<li><span class="fx-at">•</span> '+esc(nom(m.id))+' : '+esc(m.champs.map(c=>FLUX_CHAMPS[c]||c).join(', '))+'</li>'));
  diff.deplacees.forEach(id=>li.push('<li><span class="hint">↔</span> '+esc(nom(id))+' déplacée</li>'));
  diff.liens.ajoutes.forEach(id=>li.push('<li><span class="fx-ok">+</span> Flèche ajoutée : '+esc(lien(id))+'</li>'));
  diff.liens.retires.forEach(id=>li.push('<li><span class="fx-ko">✕</span> Flèche retirée : '+esc(lien(id,a))+'</li>'));
  diff.liens.modifies.forEach(m=>li.push('<li><span class="fx-at">•</span> Flèche '+esc(lien(m.id))+' modifiée</li>'));
  if(diff.reglages)li.push('<li><span class="fx-at">•</span> Réglages du calcul modifiés</li>');
  if(diff.familles.ajoutes.length+diff.familles.retires.length+diff.familles.modifies.length)li.push('<li><span class="fx-at">•</span> Familles : '+esc(FF.differencesFlux({etapes:[],liens:[],familles:a.familles,groupes:[],reglages:a.reglages,nom:a.nom},{etapes:[],liens:[],familles:f.familles,groupes:[],reglages:a.reglages,nom:a.nom}).resume)+'</li>');
  return '<section class="card" style="margin-top:12px"><h2>Actuel → futur : '+esc(diff.resume)+'</h2>'+(li.length?'<ul class="fx-diff" style="margin:0;padding-left:22px">'+li.slice(0,80).join('')+'</ul>':'<p class="hint" style="margin:0">Aucun changement : le futur est égal à la version publiée.</p>')+'</section>';
}

// PDF minimal : une page A4 paysage avec le dessin (JPEG). Aucun texte à coder : le titre est dans l'image.
function pdfDe(jpeg,l,h){
  const W=842,H=595,k=Math.min((W-40)/l,(H-40)/h),w=l*k,hh=h*k,x=(W-w)/2,y=(H-hh)/2,enc=new TextEncoder();
  const parts=[],offs=[];let n=0;const add=b=>{parts.push(b);n+=b.length};const t=s=>add(enc.encode(s));
  t('%PDF-1.4\n%\u00e2\u00e3\n');
  const contenu='q '+w.toFixed(2)+' 0 0 '+hh.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm /Im1 Do Q';
  offs[1]=n;t('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
  offs[2]=n;t('2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n');
  offs[3]=n;t('3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W+' '+H+']/Resources<</XObject<</Im1 4 0 R>>>>/Contents 5 0 R>>endobj\n');
  offs[4]=n;t('4 0 obj<</Type/XObject/Subtype/Image/Width '+jpeg.l+'/Height '+jpeg.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpeg.b.length+'>>stream\n');add(jpeg.b);t('\nendstream endobj\n');
  offs[5]=n;t('5 0 obj<</Length '+contenu.length+'>>stream\n'+contenu+'\nendstream endobj\n');
  const xref=n;t('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(i=>String(offs[i]).padStart(10,'0')+' 00000 n \n').join('')+'trailer<</Size 6/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});

// Excel (.xlsx) sans bibliothèque : classeur OpenXML en zip « stocké » (sans compression), CRC32 calculé ici.
const CRC=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[i]=c>>>0}return b=>{let c=~0;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return ~c>>>0}})();
function zipStocke(fichiers){
  const enc=new TextEncoder(),morceaux=[],centre=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  fichiers.forEach(([nom,txt])=>{const d=enc.encode(txt),nm=enc.encode(nom),c=CRC(d);
    const loc=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    morceaux.push(loc,nm,d);
    centre.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=loc.length+nm.length+d.length});
  const tc=centre.reduce((a,b)=>a+b.length,0);
  morceaux.push(...centre,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(fichiers.length),...u16(fichiers.length),...u32(tc),...u32(off),...u16(0)]));
  return new Blob(morceaux,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

async function lireFichier(el){
  const fi=el.files&&el.files[0];el.value='';if(!fi)return;
  if(fi.size>300000){F.msg=['err','<b>Fichier trop grand</b> (300 Ko au plus).'];return}
  let brut;try{brut=JSON.parse(await fi.text())}catch(e){F.msg=['err','<b>Ce fichier n’est pas lisible</b> (JSON attendu).'];return}
  if(!brut||brut.format!=='flux-atelier'||!(Number(brut.version)<=1)){F.msg=['err','<b>Ce fichier n’est pas un flux « flux-atelier » version 1</b> (fichier de l’ancien logiciel de flux).'];return}
  const f=FF.normaliserFlux(brut);
  if(!f.etapes.length){F.msg=['err','<b>Le fichier ne contient aucune case.</b>'];return}
  const cibles=secteursPerim().filter(peutDessin),carteSec={},carteMach={};
  [...new Set(f.etapes.map(e=>e.secteur||''))].forEach(s=>{carteSec[s]=cibles.includes(s)?s:''});
  f.etapes.forEach(e=>{const t=e.machineTexte;if(!t)return;carteMach[t]=carteMach[t]||''});
  F.imp={nom:fi.name.slice(0,80),f,carteSec,carteMach,commun:false,ecraser:false,occupes:null};
  autoMachines();F.msg=null;
}

// --- Saisies (champs) ------------------------------------------------------------------------------------------------
// Temps et ressources d'une case (panneau, tableau, Temps et capacités) : mêmes bornes que le bloc commun ; préparation,
// déchargement et productions à la suite (machines, 22/10) en plus. Renvoie false si la clé n'est pas un temps.
const CLES_TEMPS=['temps','personnes','machinesN','parCycle','prep','fin','suite'];
function poserTemps(x,k,v){
  if(k==='temps')x.temps.defaut=FF.fluxNombre(v,0,100000);
  else if(k==='personnes')x.capacite.personnes=FF.fluxNombre(v,0,1000);
  else if(k==='machinesN')x.capacite.machines=FF.fluxNombre(v,0,1000);
  else if(k==='parCycle')x.capacite.parCycle=FF.fluxNombre(v,1,1000);
  else if(k==='prep')x.temps.prep=FF.fluxNombre(v,0,100000);
  else if(k==='fin')x.temps.fin=FF.fluxNombre(v,0,100000);
  else if(k==='suite'){const n=FF.fluxNombre(v,1,1000);x.capacite.suite=n===null?null:Math.round(n)}
  else return false;
  return true;
}
function champCase(el){
  const id=el.dataset.id,k=el.dataset.fxc;
  if(k==='version'){F.version=el.value;F.sel=null;F.selection=[];F.relier='';return true}
  const f=futur(),e=trouver(id,f);
  if(k.startsWith('l-')){const L=trouverLien(id);if(!L)return false;
    return modifier(L.s,p=>{const l=p.liens.find(x=>x.id===id);if(!l)return;if(k==='l-part')l.part=FF.fluxNombre(el.value,0,100);if(k==='l-transfert')l.transfert=FF.fluxNombre(el.value,0,10000);if(k==='l-notes')l.notes=String(el.value).slice(0,300)})}
  if(!e)return false;
  const temps=CLES_TEMPS.includes(k);
  return modifier(e.secteur,p=>{const x=p.etapes.find(y=>y.id===id);if(!x)return;
    if(k==='nom')x.nom=FF.fluxTexte(el.value,80)||x.nom;

  if(b.dataset.act==='actualiser'&&!fluxSale()){F.d=null;F.valid.versions=null;F.valid.journal=null;F.dr.data=null;return}
  if(!(b.dataset.go||b.dataset.sec!==undefined||b.dataset.act==='actualiser'))return;
  if(b.dataset.go&&b.dataset.go.startsWith('f-')&&b.dataset.go!=='f-droits'&&b.dataset.go!=='f-valid'){F.sel=null;return}
  if(fluxSale()&&F.mode!=='local'){e.stopImmediatePropagation();e.preventDefault();F.msg=['warn','<b>Enregistrez ou annulez d’abord vos modifications du flux</b> (bouton en haut de l’écran).'];redessiner()}
  else if(F.dr.sale&&S.page==='f-droits'){e.stopImmediatePropagation();e.preventDefault();F.dr.msg=['warn','Enregistrez ou annulez d’abord les droits en cours.'];redessiner()}
},true);
addEventListener('beforeunload',e=>{if(fluxSale()&&F.mode!=='local'){e.preventDefault();e.returnValue=''}});

return {F,futur,actuel,enregistrer,fluxSale};
})();
</script>
